name: Relation creation contribution validation

on:
  push:
    branches:
      - validate/27246-relation-creation-20260917

permissions:
  contents: read

concurrency:
  group: relation-creation-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_DAEMON: 'false'
  STRAPI_TELEMETRY_DISABLED: 'true'
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  validate-and-publish:
    if: github.repository == 'dijedontahiri/strapi'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5fcd743f4965ed3efef854b6c36b60bee8fae29b
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Retrieve the validation recipe without adding it to the contribution tree
        env:
          VALIDATION_SHA: ${{ github.sha }}
        run: |
          git fetch --depth=1 origin "$VALIDATION_SHA"
          git show "$VALIDATION_SHA:.github/validation/relation-creation.py" > "$RUNNER_TEMP/relation-creation.py"
          git log -1 --format='%H %s'
      - name: Install immutable dependencies and build runtime code
        run: |
          corepack enable
          yarn install --immutable > /tmp/install.log 2>&1 || { tail -80 /tmp/install.log; exit 1; }
          yarn build:code --parallel=2 > /tmp/build.log 2>&1 || { tail -100 /tmp/build.log; exit 1; }
          tail -6 /tmp/build.log
      - name: Add real combobox regression tests
        run: |
          python3 "$RUNNER_TEMP/relation-creation.py" tests
          yarn prettier --write packages/core/content-manager/admin/src/pages/EditView/components/FormInputs/Relations/tests/RelationCreation.test.tsx
      - name: Verify regressions fail for the expected reasons before the fix
        shell: bash
        run: |
          set +e
          yarn workspace @strapi/content-manager test:front --runInBand --testPathPattern=Relations/tests/RelationCreation.test.tsx --json --outputFile=/tmp/before.json > /tmp/before.log 2>&1
          status=$?
          set -e
          test "$status" -eq 1
          node <<'NODE'
          const assert = require('node:assert/strict');
          const r = require('/tmp/before.json');
          const cases = r.testResults.flatMap(t => t.assertionResults);
          console.log(JSON.stringify(cases.map(t => ({name:t.fullName,status:t.status,failures:t.failureMessages.map(m=>m.slice(0,650))})), null, 2));
          assert.equal(cases.length, 10);
          const creation = cases.filter(t => t.fullName.includes('without connecting text'));
          assert.equal(creation.length, 5);
          assert.ok(creation.every(t => t.status === 'failed' && t.failureMessages.some(m => m.includes("You've tried to add a relation"))));
          const numeric = cases.filter(t => t.fullName.includes('numeric label'));
          assert.equal(numeric.length, 2);
          assert.ok(numeric.every(t => t.status === 'failed' && t.failureMessages.some(m => m.includes('Received:') && m.includes('[1]'))));
          assert.equal(r.numPassedTests, 3);
          assert.equal(r.numFailedTests, 7);
          NODE
      - name: Check guarded uncontrolled selection before adding state changes
        run: |
          python3 "$RUNNER_TEMP/relation-creation.py" fix
          python3 <<'PY'
          from pathlib import Path
          p = Path('packages/core/content-manager/admin/src/pages/EditView/components/FormInputs/Relations/Relations.tsx')
          s = p.read_text()
          assert s.count('          value=""\n') == 1
          p.write_text(s.replace('          value=""\n', ''))
          PY
          set +e
          yarn workspace @strapi/content-manager test:front --runInBand --testPathPattern=Relations/tests/RelationCreation.test.tsx --json --outputFile=/tmp/guard-only.json > /tmp/guard-only.log 2>&1
          status=$?
          set -e
          node <<'NODE'
          const r=require('/tmp/guard-only.json');
          console.log(JSON.stringify({variant:'guard-only',passed:r.numPassedTests,failed:r.numFailedTests,cases:r.testResults.flatMap(t=>t.assertionResults).map(t=>({name:t.fullName,status:t.status,failures:t.failureMessages.map(m=>m.slice(0,1300))}))},null,2));
          NODE
          echo "$status" > /tmp/guard-status
      - name: Preserve controlled selection when the uncontrolled value is retained
        run: |
          if [ "$(cat /tmp/guard-status)" = 0 ]; then
            echo 'The minimal guard alone passed; no value-state change is needed.'
          else
            python3 <<'PY'
          from pathlib import Path
          p = Path('packages/core/content-manager/admin/src/pages/EditView/components/FormInputs/Relations/Relations.tsx')
          s=p.read_text()
          old="  const isCreatingRelation = React.useRef(false);"
          assert s.count(old)==1
          s=s.replace(old,"  const [selectedValue, setSelectedValue] = React.useState('');\n"+old)
          old="              isCreatingRelation.current = false;"
          assert s.count(old)==1
          s=s.replace(old,old+"\n              setSelectedValue('');")
          old="          onChange={(relationId) => {\n            if (!isCreatingRelation.current) {"
          assert s.count(old)==1
          s=s.replace(old,"          value={selectedValue}\n          onChange={(relationId) => {\n            setSelectedValue(relationId ?? '');\n            if (!isCreatingRelation.current) {")
          p.write_text(s)
          PY
          fi
          yarn prettier --write packages/core/content-manager/admin/src/pages/EditView/components/FormInputs/Relations/Relations.tsx
          set +e
          yarn workspace @strapi/content-manager test:front --runInBand --testPathPattern=FormInputs/Relations/tests --json --outputFile=/tmp/after.json > /tmp/after.log 2>&1
          status=$?
          set -e
          node <<'NODE'
          const r=require('/tmp/after.json');
          console.log(JSON.stringify({passed:r.numPassedTests,failed:r.numFailedTests,suites:r.numPassedTestSuites,cases:r.testResults.flatMap(t=>t.assertionResults).filter(t=>t.status==='failed').map(t=>({name:t.fullName,failures:t.failureMessages.map(m=>m.slice(0,1500))}))},null,2));
          NODE
          tail -9 /tmp/after.log
          test "$status" -eq 0
      - name: Build declarations required by repository hooks
        run: |
          yarn build --parallel=2 > /tmp/full-build.log 2>&1 || { tail -100 /tmp/full-build.log; exit 1; }
          tail -8 /tmp/full-build.log
      - name: Commit only the fix and regression tests with repository hooks enabled
        id: candidate
        run: |
          git config user.name dijedontahiri
          git config user.email 99071957+dijedontahiri@users.noreply.github.com
          git add packages/core/content-manager/admin/src/pages/EditView/components/FormInputs/Relations/Relations.tsx packages/core/content-manager/admin/src/pages/EditView/components/FormInputs/Relations/tests/RelationCreation.test.tsx
          git diff --cached --check
          git diff --cached --stat
          git diff --cached -- packages/core/content-manager/admin/src/pages/EditView/components/FormInputs/Relations/Relations.tsx
          git commit -m "fix(content-manager): creating relations treats labels as existing ids"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git log -1 --format='%H %s'
      - name: Complete content-manager frontend suite on the candidate commit
        run: |
          yarn workspace @strapi/content-manager test:front --runInBand > /tmp/front.log 2>&1 || { tail -120 /tmp/front.log; exit 1; }
          tail -9 /tmp/front.log
      - name: Rebuild the candidate and run package type checks
        run: |
          yarn build --parallel=2 > /tmp/rebuild.log 2>&1 || { tail -100 /tmp/rebuild.log; exit 1; }
          tail -8 /tmp/rebuild.log
          yarn workspace @strapi/content-manager test:ts > /tmp/types.log 2>&1 || { tail -100 /tmp/types.log; exit 1; }
          tail -5 /tmp/types.log
      - name: Content-manager lint and changed-file formatting
        run: |
          yarn workspace @strapi/content-manager lint > /tmp/lint.log 2>&1 || { tail -100 /tmp/lint.log; exit 1; }
          tail -5 /tmp/lint.log
          yarn prettier --check packages/core/content-manager/admin/src/pages/EditView/components/FormInputs/Relations/Relations.tsx packages/core/content-manager/admin/src/pages/EditView/components/FormInputs/Relations/tests/RelationCreation.test.tsx
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Publish the exact tested commit to a clean contribution branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=fix/27246-relation-creation-selection
          existing=$(git ls-remote origin "refs/heads/$branch")
          test -z "$existing" || { echo 'Contribution branch already exists; refusing to overwrite it.'; exit 1; }
          git -c 'credential.helper=!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push origin "HEAD:refs/heads/$branch"
          echo "Published $(git rev-parse HEAD) on $branch"

  node-24-verification:
    needs: validate-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate-and-publish.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Build and verify the exact published commit on Node 24
        run: |
          corepack enable
          yarn install --immutable > /tmp/install.log 2>&1 || { tail -80 /tmp/install.log; exit 1; }
          yarn build --parallel=2 > /tmp/build.log 2>&1 || { tail -100 /tmp/build.log; exit 1; }
          yarn workspace @strapi/content-manager test:front --runInBand > /tmp/front.log 2>&1 || { tail -120 /tmp/front.log; exit 1; }
          tail -9 /tmp/front.log
          yarn workspace @strapi/content-manager test:ts > /tmp/types.log 2>&1 || { tail -100 /tmp/types.log; exit 1; }
          yarn workspace @strapi/content-manager lint > /tmp/lint.log 2>&1 || { tail -100 /tmp/lint.log; exit 1; }
          yarn prettier --check packages/core/content-manager/admin/src/pages/EditView/components/FormInputs/Relations/Relations.tsx packages/core/content-manager/admin/src/pages/EditView/components/FormInputs/Relations/tests/RelationCreation.test.tsx
          test -z "$(git status --porcelain --untracked-files=no)"
          git log -1 --format='%H %s'
