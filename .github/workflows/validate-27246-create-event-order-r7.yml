name: Diagnose #27246 r7 focused regression

on:
  push:
    branches:
      - validate/27246-r7-diagnostics-20260922

permissions:
  contents: read

concurrency:
  group: diagnose-27246-r7-${{ github.ref }}
  cancel-in-progress: false

env:
  NX_DAEMON: 'false'
  STRAPI_TELEMETRY_DISABLED: 'true'
  SOURCE_SHA: 142d9c6b31f35766e390e9ff78595d83f5b97904

jobs:
  diagnose:
    if: github.repository == 'dijedontahiri/strapi'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out validation harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: validate/27246-r7-diagnostics-20260922
          path: harness
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact upstream source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: strapi/strapi
          ref: 142d9c6b31f35766e390e9ff78595d83f5b97904
          path: source
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Verify exact source
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git hash-object packages/core/content-manager/admin/src/pages/EditView/components/FormInputs/Relations/Relations.tsx)" = "12a0d4669e7e90dc2607261249d8eb918e56eb0d"

      - name: Install dependencies
        working-directory: source
        run: |
          corepack enable
          yarn install --immutable

      - name: Build content-manager dependencies
        working-directory: source
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: yarn nx run @strapi/content-manager:build --nx-ignore-cycles --parallel=2

      - name: Add exact regression coverage
        working-directory: source
        run: |
          python3 ../harness/.github/validation/relation-creation.py tests
          yarn prettier --write packages/core/content-manager/admin/src/pages/EditView/components/FormInputs/Relations/tests/RelationCreation.test.tsx

      - name: Apply identical r7 candidate
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          p = Path('packages/core/content-manager/admin/src/pages/EditView/components/FormInputs/Relations/Relations.tsx')
          expected = '12a0d4669e7e90dc2607261249d8eb918e56eb0d'
          actual = subprocess.check_output(['git', 'hash-object', str(p)], text=True).strip()
          if actual != expected:
              raise SystemExit(f'unexpected source blob: {actual}')

          s = p.read_text()
          replacements = [
            (
              "  const [textValue, setTextValue] = React.useState<string | undefined>('');",
              "  const [textValue, setTextValue] = React.useState<string | undefined>('');\n  const createRelationValue = React.useRef<string>();"
            ),
            (
              "          onCreateOption={() => {\n            if (canCreate) {\n              dispatch({",
              "          onCreateOption={() => {\n            if (canCreate) {\n              const value = textValue ?? '';\n              createRelationValue.current = value;\n              window.setTimeout(() => {\n                if (createRelationValue.current === value) {\n                  createRelationValue.current = undefined;\n                }\n              });\n\n              dispatch({"
            ),
            (
              "          onChange={handleChange}",
              "          onChange={(relationId) => {\n            if (relationId !== textValue) {\n              handleChange(relationId);\n              return;\n            }\n\n            queueMicrotask(() => {\n              if (createRelationValue.current === relationId) {\n                createRelationValue.current = undefined;\n                return;\n              }\n\n              handleChange(relationId);\n            });\n          }}"
            ),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'marker missing/ambiguous: {old!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          yarn prettier --write packages/core/content-manager/admin/src/pages/EditView/components/FormInputs/Relations/Relations.tsx

      - name: Run focused regression and preserve exact failures
        id: focused
        working-directory: source
        shell: bash
        run: |
          set +e
          yarn workspace @strapi/content-manager test:front --runInBand --testPathPattern=Relations/tests/RelationCreation.test.tsx --json --outputFile=/tmp/after.json > /tmp/after.log 2>&1
          status=$?
          set -e
          cat /tmp/after.log
          node <<'NODE' > /tmp/after-summary.txt
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('/tmp/after.json', 'utf8'));
          const assertions = r.testResults.flatMap((suite) => suite.assertionResults.map((a) => ({
            fullName: a.fullName,
            status: a.status,
            failureMessages: a.failureMessages,
          })));
          console.log(JSON.stringify({
            numTotalTests: r.numTotalTests,
            numPassedTests: r.numPassedTests,
            numFailedTests: r.numFailedTests,
            assertions,
          }, null, 2));
          NODE
          cat /tmp/after-summary.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Upload focused diagnostic artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: relation-r7-focused-diagnostics
          path: |
            /tmp/after.json
            /tmp/after.log
            /tmp/after-summary.txt
          if-no-files-found: error
          retention-days: 3

      - name: Preserve focused test result
        if: always()
        shell: bash
        run: exit "${{ steps.focused.outputs.status || '1' }}"
