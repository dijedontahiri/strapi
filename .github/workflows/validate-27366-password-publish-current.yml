name: Validate password publish current

on:
  push:
    branches:
      - validate/27366-password-publish-current-20260919

permissions:
  contents: read

concurrency:
  group: validate-27366-current-${{ github.ref }}
  cancel-in-progress: false

env:
  NX_DAEMON: 'false'
  STRAPI_TELEMETRY_DISABLED: 'true'
  EXPECTED_SOURCE: bcf7f30fdb541635a79de30e6c85b668ff03d3a8
  BASE_SOURCE: d83af0410bf31b034b01757729f2231862ee5e87

jobs:
  core:
    if: github.repository == 'dijedontahiri/strapi'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bcf7f30fdb541635a79de30e6c85b668ff03d3a8
          fetch-depth: 8
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - name: Install pinned dependencies
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          git cat-file -e "$BASE_SOURCE^{commit}"
          corepack enable
          yarn install --immutable
      - name: Build runtime packages for API tests
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: yarn build:code --parallel=2
      - name: Prove the regression against current develop
        if: matrix.node == 22
        shell: bash
        run: |
          set -euo pipefail
          entries=packages/core/core/src/services/document-service/entries.ts
          attributes=packages/core/core/src/services/document-service/attributes/index.ts
          cp "$entries" /tmp/fixed-entries.ts
          cp "$attributes" /tmp/fixed-attributes.ts
          trap 'cp /tmp/fixed-entries.ts "$entries"; cp /tmp/fixed-attributes.ts "$attributes"' EXIT
          git show "$BASE_SOURCE:$entries" > "$entries"
          git show "$BASE_SOURCE:$attributes" > "$attributes"
          yarn workspace @strapi/core build:code
          set +e
          yarn test:api --db=sqlite tests/api/core/content-manager/password-publish-validation.test.api.js --json --outputFile=/tmp/password-baseline.json
          status=$?
          set -e
          test "$status" -ne 0
          node <<'NODE'
          const result = require('/tmp/password-baseline.json');
          if (result.numFailedTests !== 1 || result.numPassedTests !== 1 || result.numTotalTestSuites !== 1) {
            throw new Error(`Unexpected baseline result: ${result.numFailedTests} failed, ${result.numPassedTests} passed`);
          }
          const assertions = result.testResults.flatMap((suite) => suite.assertionResults ?? []);
          const failure = assertions.find((assertion) => assertion.status === 'failed');
          if (!failure?.fullName?.includes('publishing validates the plaintext length once and preserves the stored password hash')) {
            throw new Error('Expected the publish/hash regression to be the single baseline failure');
          }
          NODE
          cp /tmp/fixed-entries.ts "$entries"
          cp /tmp/fixed-attributes.ts "$attributes"
          trap - EXIT
          yarn workspace @strapi/core build:code
      - name: Run password publish regression on the candidate
        run: yarn test:api --db=sqlite tests/api/core/content-manager/password-publish-validation.test.api.js
      - name: Run affected core unit suites
        run: yarn workspace @strapi/core test:unit --runInBand --testPathPattern='services/(document-service|entity-validator)'
      - name: Type-check core
        run: yarn workspace @strapi/core test:ts
      - name: Lint core
        run: yarn workspace @strapi/core lint
      - name: Check changed-file formatting
        run: yarn prettier --check packages/core/core/src/services/document-service/entries.ts packages/core/core/src/services/document-service/attributes/index.ts tests/api/core/content-manager/password-publish-validation.test.api.js
      - name: Verify exact source and focused diff
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --check "$BASE_SOURCE" HEAD
          actual="$(git diff --name-only "$BASE_SOURCE" HEAD | sort)"
          expected="$(printf '%s\n' packages/core/core/src/services/document-service/entries.ts packages/core/core/src/services/document-service/attributes/index.ts tests/api/core/content-manager/password-publish-validation.test.api.js | sort)"
          test "$actual" = "$expected"
