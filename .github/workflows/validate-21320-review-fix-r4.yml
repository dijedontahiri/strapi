name: Validate final 21320 review follow-up
on:
  push:
    branches: [validate/21320-review-fix-r4-20260919]
permissions:
  contents: read
env:
  SOURCE_SHA: 7ebbe2b77397b7a2ad5a38e7a59cb8d4bbf7210c
  BASE_SHA: d83af0410bf31b034b01757729f2231862ee5e87
  NX_DAEMON: 'false'
  STRAPI_TELEMETRY_DISABLED: 'true'
  NODE_OPTIONS: --max-old-space-size=6144
jobs:
  validate:
    if: github.repository == 'dijedontahiri/strapi'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7ebbe2b77397b7a2ad5a38e7a59cb8d4bbf7210c
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - name: Install and build
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          corepack enable
          yarn install --immutable
          yarn nx run @strapi/content-releases:build --nx-ignore-cycles --parallel=2
      - name: Baseline negative control
        if: matrix.node == 22
        shell: bash
        run: |
          set -euo pipefail
          source=packages/core/content-releases/admin/src/components/ReleasesPanel.tsx
          cp "$source" /tmp/fixed-panel.tsx
          trap 'cp /tmp/fixed-panel.tsx "$source"' EXIT
          git show "$BASE_SHA:$source" > "$source"
          set +e
          yarn workspace @strapi/content-releases test:front --runInBand --testPathPattern=ReleasesPanel.test.tsx --json --outputFile=/tmp/before.json
          status=$?
          set -e
          test "$status" -ne 0
          node -e "const r=require('/tmp/before.json'); if(r.numRuntimeErrorTestSuites!==0||r.numFailedTests!==1||r.numPassedTests!==8) process.exit(1)"
          cp /tmp/fixed-panel.tsx "$source"
          trap - EXIT
      - name: Focused regressions
        run: yarn workspace @strapi/content-releases test:front --runInBand --testPathPattern=ReleasesPanel.test.tsx
      - name: Complete frontend suite
        run: yarn workspace @strapi/content-releases test:front --runInBand
      - name: Server unit suite
        run: yarn workspace @strapi/content-releases test:unit --runInBand
      - name: Frontend types
        run: yarn workspace @strapi/content-releases test:ts:front
      - name: Lint
        run: yarn workspace @strapi/content-releases lint
      - name: Format and exact diff
        shell: bash
        run: |
          files=(packages/core/content-releases/admin/src/components/ReleasesPanel.tsx packages/core/content-releases/admin/src/components/ReleaseActionMenu.tsx packages/core/content-releases/admin/src/components/tests/ReleasesPanel.test.tsx)
          yarn prettier --check "${files[@]}"
          git diff --check "$BASE_SHA"
          actual="$(git diff --name-only "$BASE_SHA" | sort)"
          expected="$(printf '%s\n' "${files[@]}" | sort)"
          test "$actual" = "$expected"
          test "$(git status --porcelain)" = ""
