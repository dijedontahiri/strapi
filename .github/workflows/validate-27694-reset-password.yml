name: Validate reset password strength errors

on:
  push:
    branches:
      - validate/27694-reset-password-validation

permissions:
  contents: read

env:
  NX_DAEMON: 'false'
  STRAPI_TELEMETRY_DISABLED: 'true'

jobs:
  verify:
    if: github.repository == 'dijedontahiri/strapi'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fa94d29f9f37593b5b3a86d36ee6e98fe5f06c28
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - name: Install pinned dependencies
        run: |
          corepack enable
          yarn install --immutable
      - name: Prove the new regression cases fail before the fix
        if: matrix.node == 22
        shell: bash
        run: |
          source=packages/core/admin/admin/src/pages/Auth/components/ResetPassword.tsx
          trap 'git restore -- "$source"' EXIT
          git show 5fcd743f4965ed3efef854b6c36b60bee8fae29b:"$source" > "$source"
          set +e
          yarn workspace @strapi/admin test:front --runInBand --runTestsByPath admin/src/pages/Auth/components/tests/ResetPassword.test.tsx --json --outputFile=/tmp/reset-before.json
          status=$?
          set -e
          test "$status" -eq 1
          node - <<'NODE'
          const result = require('/tmp/reset-before.json');
          if (result.numFailedTests !== 3 || result.numPassedTests !== 6) {
            throw new Error(`Expected 3 strength-message regressions and 6 passing controls; got ${result.numFailedTests} failed and ${result.numPassedTests} passed`);
          }
          console.log('Upstream baseline confirmed: 3 strength-message regressions fail and 6 controls pass');
          NODE
          git restore -- "$source"
          trap - EXIT
      - name: Run focused reset password tests
        run: yarn workspace @strapi/admin test:front --runInBand --runTestsByPath admin/src/pages/Auth/components/tests/ResetPassword.test.tsx
      - name: Run complete admin frontend test suite
        run: yarn workspace @strapi/admin test:front --runInBand
      - name: Type-check admin frontend
        run: yarn workspace @strapi/admin test:ts:front
      - name: Lint admin package
        run: yarn workspace @strapi/admin lint
      - name: Check changed-file formatting
        run: yarn prettier --check packages/core/admin/admin/src/pages/Auth/components/ResetPassword.tsx packages/core/admin/admin/src/pages/Auth/components/tests/ResetPassword.test.tsx
      - name: Verify exact submitted source remains clean
        run: git diff --exit-code
