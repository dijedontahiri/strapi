name: Validate reset password strength feedback

on:
  push:
    branches:
      - validate/27694-reset-password-20260920-r1

permissions:
  contents: read

concurrency:
  group: validate-27694-reset-password-${{ github.ref }}
  cancel-in-progress: false

env:
  NX_DAEMON: 'false'
  STRAPI_TELEMETRY_DISABLED: 'true'
  EXPECTED_SOURCE: fa94d29f9f37593b5b3a86d36ee6e98fe5f06c28
  BASE_SOURCE: d83af0410bf31b034b01757729f2231862ee5e87
  MERGE_BASE: 5fcd743f4965ed3efef854b6c36b60bee8fae29b

jobs:
  admin-front:
    if: github.repository == 'dijedontahiri/strapi'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fa94d29f9f37593b5b3a86d36ee6e98fe5f06c28
          fetch-depth: 20
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          git fetch --no-tags origin "$BASE_SOURCE" --depth=20
          git cat-file -e "$BASE_SOURCE^{commit}"
          git cat-file -e "$MERGE_BASE^{commit}"
          corepack enable
          yarn install --immutable
      - name: Build admin and workspace dependencies
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: yarn nx run @strapi/admin:build --nx-ignore-cycles --parallel=2
      - name: Prove password-strength feedback regression against current develop
        if: matrix.node == 22
        shell: bash
        run: |
          set -euo pipefail
          source=packages/core/admin/admin/src/pages/Auth/components/ResetPassword.tsx
          cp "$source" /tmp/fixed-reset-password.tsx
          trap 'cp /tmp/fixed-reset-password.tsx "$source"' EXIT
          git show "$BASE_SOURCE:$source" > "$source"
          set +e
          yarn workspace @strapi/admin test:front --runInBand --testPathPattern=ResetPassword.test.tsx --json --outputFile=/tmp/reset-password-before.json
          status=$?
          set -e
          test "$status" -eq 1
          node - <<'NODE'
          const result = require('/tmp/reset-password-before.json');
          if (
            result.numFailedTests !== 3 ||
            result.numPassedTests !== 6 ||
            result.numTotalTests !== 9 ||
            result.numTotalTestSuites !== 1
          ) {
            throw new Error(`Unexpected baseline result: ${JSON.stringify({
              failed: result.numFailedTests,
              passed: result.numPassedTests,
              total: result.numTotalTests,
              suites: result.numTotalTestSuites,
            })}`);
          }
          NODE
          cp /tmp/fixed-reset-password.tsx "$source"
          trap - EXIT
      - name: Run focused frontend regression test
        run: yarn workspace @strapi/admin test:front --runInBand --testPathPattern=ResetPassword.test.tsx
      - name: Run complete admin frontend suite
        run: yarn workspace @strapi/admin test:front --runInBand
      - name: Type-check admin frontend
        run: yarn workspace @strapi/admin test:ts:front
      - name: Lint admin package
        run: yarn workspace @strapi/admin lint
      - name: Check changed-file formatting
        run: yarn prettier --check packages/core/admin/admin/src/pages/Auth/components/ResetPassword.tsx packages/core/admin/admin/src/pages/Auth/components/tests/ResetPassword.test.tsx
      - name: Verify exact source and focused diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --check "$MERGE_BASE" HEAD
          actual="$(git diff --name-only "$MERGE_BASE" HEAD | sort)"
          expected="$(printf '%s\n' packages/core/admin/admin/src/pages/Auth/components/ResetPassword.tsx packages/core/admin/admin/src/pages/Auth/components/tests/ResetPassword.test.tsx | sort)"
          test "$actual" = "$expected"
