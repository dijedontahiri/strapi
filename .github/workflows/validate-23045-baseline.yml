name: Validate 23045 baseline

on:
  push:
    branches:
      - validation/23045-baseline

permissions:
  contents: read

jobs:
  baseline:
    if: github.repository == 'dijedontahiri/strapi'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: corepack enable
      - run: yarn install --immutable
      - name: Prove regression fails before fix
        shell: bash
        run: |
          set +e
          output=$(yarn workspace @strapi/strapi test:unit src/node/vite/postcss-config.test.ts --runInBand 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo 'Regression unexpectedly passed on the baseline implementation.' >&2
            exit 1
          fi
          printf '%s\n' "$output" | grep -F 'uses inline PostCSS options so parent configs are not discovered'
          printf '%s\n' "$output" | grep -F 'postcss-config.test.ts'
          echo 'Baseline regression reproduced as an assertion failure.'
