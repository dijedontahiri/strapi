name: Validate 23738 remote asset sizing

on:
  push:
    branches:
      - validate/23738-chunked-asset-size-r1-20260922

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'dijedontahiri/strapi'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          repository: dijedontahiri/strapi
          ref: 470fd41e99e6dade24576f2dde20aedba0a3dbd3
          fetch-depth: 0

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Verify exact candidate and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "470fd41e99e6dade24576f2dde20aedba0a3dbd3"
          mapfile -t changed < <(git diff --name-only 142d9c6b31f35766e390e9ff78595d83f5b97904..HEAD | sort)
          expected=(
            "packages/core/data-transfer/src/strapi/providers/local-source/__tests__/assets.test.ts"
            "packages/core/data-transfer/src/strapi/providers/local-source/assets.ts"
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}"
          done

      - name: Baseline focused regression
        if: matrix.node == 22
        id: baseline-focused
        continue-on-error: true
        shell: bash
        run: |
          git checkout 142d9c6b31f35766e390e9ff78595d83f5b97904 -- packages/core/data-transfer/src/strapi/providers/local-source/assets.ts
          yarn workspace @strapi/data-transfer test:unit --runInBand src/strapi/providers/local-source/__tests__/assets.test.ts -t "measures remote assets when the response has no content-length header"

      - name: Negative control fails as expected
        if: matrix.node == 22 && steps.baseline-focused.outcome == 'failure'
        run: echo "Focused regression fails on develop as expected"

      - name: Invalid negative control passed
        if: matrix.node == 22 && steps.baseline-focused.outcome == 'success'
        run: exit 1

      - name: Baseline package unit suite
        if: matrix.node == 22
        id: baseline-suite
        continue-on-error: true
        shell: bash
        run: |
          git checkout 142d9c6b31f35766e390e9ff78595d83f5b97904 -- packages/core/data-transfer/src/strapi/providers/local-source/assets.ts packages/core/data-transfer/src/strapi/providers/local-source/__tests__/assets.test.ts
          yarn workspace @strapi/data-transfer test:unit --runInBand

      - name: Baseline package suite passed
        if: matrix.node == 22 && steps.baseline-suite.outcome == 'success'
        run: echo "Baseline package unit suite is green"

      - name: Baseline package suite failed
        if: matrix.node == 22 && steps.baseline-suite.outcome == 'failure'
        run: echo "Baseline package unit suite is not green in this runner"

      - name: Restore exact candidate
        shell: bash
        run: |
          git checkout 470fd41e99e6dade24576f2dde20aedba0a3dbd3 -- packages/core/data-transfer/src/strapi/providers/local-source/assets.ts packages/core/data-transfer/src/strapi/providers/local-source/__tests__/assets.test.ts
          git diff --exit-code

      - name: Run complete assets regression file
        run: yarn workspace @strapi/data-transfer test:unit --runInBand src/strapi/providers/local-source/__tests__/assets.test.ts

      - name: Run candidate package unit suite
        id: candidate-suite
        continue-on-error: true
        run: yarn workspace @strapi/data-transfer test:unit --runInBand

      - name: Candidate package suite passed
        if: steps.candidate-suite.outcome == 'success'
        run: echo "Candidate package unit suite is green"

      - name: Candidate package suite failed
        if: steps.candidate-suite.outcome == 'failure'
        run: exit 1

      - name: Run data-transfer TypeScript checks
        run: yarn workspace @strapi/data-transfer test:ts

      - name: Build data-transfer
        run: yarn workspace @strapi/data-transfer build

      - name: Run data-transfer lint
        run: yarn workspace @strapi/data-transfer lint

      - name: Check formatting
        run: yarn prettier --check packages/core/data-transfer/src/strapi/providers/local-source/assets.ts packages/core/data-transfer/src/strapi/providers/local-source/__tests__/assets.test.ts

      - name: Verify final exact tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "470fd41e99e6dade24576f2dde20aedba0a3dbd3"
          git diff --exit-code
