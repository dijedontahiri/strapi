name: Validate issue 27791 false boolean filter r2

on:
  push:
    branches:
      - validate/27791-admin-user-false-filter-r2-20260924

permissions:
  contents: read

concurrency:
  group: validate-27791-r2-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_DAEMON: 'false'
  STRAPI_TELEMETRY_DISABLED: 'true'
  SOURCE_SHA: 080f84070da205de8599860301382e970a7fdaeb
  BASE_SHA: a82c2d8bab32d61eb8399f6f3b244cbcc03cca13
  SOURCE_FILE: packages/core/admin/admin/src/components/Filters.tsx
  TEST_FILE: packages/core/admin/admin/src/components/tests/Filters.boolean.test.tsx

jobs:
  verify:
    if: github.repository == 'dijedontahiri/strapi'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}

      - name: Install pinned dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Build admin package and dependencies
        run: yarn nx run @strapi/admin:build --nx-ignore-cycles --parallel=2

      - name: Prove baseline regression
        if: matrix.node == 22
        shell: bash
        run: |
          git checkout "$BASE_SHA" -- "$SOURCE_FILE"
          set +e
          output=$(yarn workspace @strapi/admin test:front --runInBand --testPathPattern=Filters.boolean.test.tsx --testNamePattern='applies false when a boolean filter is submitted in its false state' 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo 'Baseline unexpectedly passed the false boolean filter regression.' >&2
            exit 1
          fi
          printf '%s\n' "$output" | grep -F 'applies false when a boolean filter is submitted in its false state'
          printf '%s\n' "$output" | grep -F 'Expected: "false"'
          printf '%s\n' "$output" | grep -F 'Received: null'
          git checkout "$SOURCE_SHA" -- "$SOURCE_FILE"

      - name: Run focused regression
        run: yarn workspace @strapi/admin test:front --runInBand --testPathPattern=Filters.boolean.test.tsx --testNamePattern='applies false when a boolean filter is submitted in its false state'

      - name: Run complete admin frontend suite
        run: yarn workspace @strapi/admin test:front --runInBand

      - name: Type-check admin frontend
        run: yarn workspace @strapi/admin test:ts:front

      - name: Lint admin package
        run: yarn workspace @strapi/admin lint

      - name: Check changed-file formatting
        run: yarn prettier --check "$SOURCE_FILE" "$TEST_FILE"

      - name: Verify exact source and focused diff
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --check "$BASE_SHA" "$SOURCE_SHA"
          mapfile -t files < <(git diff --name-only "$BASE_SHA" "$SOURCE_SHA")
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 2
          test "${files[0]}" = 'packages/core/admin/admin/src/components/Filters.tsx'
          test "${files[1]}" = 'packages/core/admin/admin/src/components/tests/Filters.boolean.test.tsx'
          test -z "$(git status --porcelain)"
