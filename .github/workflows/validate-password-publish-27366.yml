name: Validate password publish fix

on:
  push:
    branches:
      - validate/27366-password-publish-validation

permissions:
  contents: read

env:
  NX_DAEMON: 'false'
  STRAPI_TELEMETRY_DISABLED: 'true'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install pinned dependencies
        run: |
          corepack enable
          yarn install --immutable
      - name: Build runtime packages for API tests
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: yarn build:code --parallel=2
      - name: Run password publish regression on the fix
        run: yarn test:api --db=sqlite tests/api/core/content-manager/password-publish-validation.test.api.js
      - name: Prove the regression fails on upstream develop
        shell: bash
        run: |
          entries=packages/core/core/src/services/document-service/entries.ts
          attributes=packages/core/core/src/services/document-service/attributes/index.ts
          trap 'git restore -- "$entries" "$attributes"' EXIT
          git show 5fcd743f4965ed3efef854b6c36b60bee8fae29b:"$entries" > "$entries"
          git show 5fcd743f4965ed3efef854b6c36b60bee8fae29b:"$attributes" > "$attributes"
          yarn workspace @strapi/core build:code
          set +e
          yarn test:api --db=sqlite tests/api/core/content-manager/password-publish-validation.test.api.js
          status=$?
          set -e
          test "$status" -ne 0
          git restore -- "$entries" "$attributes"
          trap - EXIT
          yarn workspace @strapi/core build:code
      - name: Run affected core unit suites
        run: yarn workspace @strapi/core test:unit --runInBand --testPathPattern='services/(document-service|entity-validator)'
      - name: Type-check core
        run: yarn workspace @strapi/core test:ts
      - name: Lint core
        run: yarn workspace @strapi/core lint
      - name: Check changed-file formatting
        run: yarn prettier --check packages/core/core/src/services/document-service/entries.ts packages/core/core/src/services/document-service/attributes/index.ts tests/api/core/content-manager/password-publish-validation.test.api.js
