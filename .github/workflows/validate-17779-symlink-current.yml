name: Diagnose uploads symlink formatting

on:
  push:
    branches:
      - validate/17779-symlink-20260919

permissions:
  contents: read

concurrency:
  group: validate-17779-current-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_SOURCE: 6c7646f596e1ed1cf2ecc7e3000f3937a1724fbe

jobs:
  prettier-diff:
    if: github.repository == 'dijedontahiri/strapi'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6c7646f596e1ed1cf2ecc7e3000f3937a1724fbe
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install pinned dependencies
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          corepack enable
          yarn install --immutable
      - name: Print exact Prettier rewrite
        run: |
          file=packages/core/data-transfer/src/strapi/providers/local-destination/__tests__/assets-symlink.test.ts
          yarn prettier --write "$file"
          git diff -- "$file"
