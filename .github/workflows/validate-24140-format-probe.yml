name: Validate #24140 formatting probe

on:
  push:
    branches:
      - validate/24140-format-probe-20260920

permissions:
  contents: read

jobs:
  format:
    if: github.repository == 'dijedontahiri/strapi'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 50a404767f7a4580688d63360ccb0deaf44f8b3e
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable
      - name: Show formatter diff
        shell: bash
        run: |
          set -euo pipefail
          file=packages/core/content-type-builder/server/src/services/schema-builder/component-builder.ts
          yarn prettier --write "$file"
          git diff -- "$file"
