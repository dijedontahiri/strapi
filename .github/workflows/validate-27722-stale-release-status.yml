name: Validate 27722 stale release status

on:
  push:
    branches:
      - validate/27722-stale-release-status

permissions:
  contents: read

env:
  SOURCE_SHA: d83af0410bf31b034b01757729f2231862ee5e87

jobs:
  validate:
    if: github.repository == 'dijedontahiri/strapi'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation harness
        uses: actions/checkout@v4
        with:
          repository: dijedontahiri/strapi
          ref: validate/27722-stale-release-status
          path: harness
          fetch-depth: 1

      - name: Checkout immutable upstream source
        uses: actions/checkout@v4
        with:
          repository: strapi/strapi
          ref: ${{ env.SOURCE_SHA }}
          path: source
          fetch-depth: 1

      - name: Verify source identity
        run: |
          cd source
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
          cache-dependency-path: source/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: |
          cd source
          yarn install --immutable

      - name: Build runtime, declaration, and lint workspace dependencies
        run: |
          cd source
          yarn nx run-many --targets=build --projects=@strapi/admin,@strapi/content-manager,@strapi/types,@strapi/utils,@strapi/database --nx-ignore-cycles --parallel=3

      - name: Add baseline regression tests
        run: |
          cd source
          python ../harness/.github/validation/validate_27722.py tests
          python - <<'PY'
          from pathlib import Path
          p = Path('packages/core/content-releases/server/src/services/__tests__/release-stale-status.test.ts')
          s = p.read_text()
          old = "transaction: jest.fn(async (callback: any) => callback({ trx: {} })),"
          new = "transaction: jest.fn(async (fn: any) => fn({ trx: {} })),"
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Prove regression on upstream source
        shell: bash
        run: |
          cd source
          set +e
          yarn workspace @strapi/content-releases test:unit --runInBand --testPathPattern='release-(stale-status|action-revalidation).test.ts' > /tmp/baseline.log 2>&1
          code=$?
          set -e
          cat /tmp/baseline.log
          if [ "$code" -eq 0 ]; then
            echo 'Regression tests unexpectedly pass on upstream source'
            exit 1
          fi
          grep -q "release publish stale validity status" /tmp/baseline.log
          grep -q "release action revalidation by release" /tmp/baseline.log

      - name: Apply candidate
        run: |
          cd source
          python ../harness/.github/validation/validate_27722.py candidate
          python - <<'PY'
          from pathlib import Path
          p = Path('packages/core/content-releases/server/src/services/__tests__/release-stale-status.test.ts')
          s = p.read_text()
          old = "transaction: jest.fn(async (callback: any) => callback({ trx: {} })),"
          new = "transaction: jest.fn(async (fn: any) => fn({ trx: {} })),"
          if old in s:
              p.write_text(s.replace(old, new, 1))
          PY

      - name: Run focused regressions
        run: |
          cd source
          yarn workspace @strapi/content-releases test:unit --runInBand --testPathPattern='release-(stale-status|action-revalidation).test.ts'

      - name: Run content-releases unit suite
        run: |
          cd source
          yarn workspace @strapi/content-releases test:unit --runInBand

      - name: Typecheck server declarations
        run: |
          cd source
          yarn workspace @strapi/content-releases build:types:server

      - name: Lint changed package
        run: |
          cd source
          yarn workspace @strapi/content-releases lint

      - name: Check formatting
        run: |
          cd source
          yarn prettier --check packages/core/content-releases/server/src/services/release.ts packages/core/content-releases/server/src/services/release-action.ts packages/core/content-releases/server/src/services/__tests__/release.test.ts packages/core/content-releases/server/src/services/__tests__/release-stale-status.test.ts packages/core/content-releases/server/src/services/__tests__/release-action-revalidation.test.ts

      - name: Verify only intended source changes
        run: |
          cd source
          git status --short
          git diff --check
          git diff --exit-code -- . \
            ':(exclude)packages/core/content-releases/server/src/services/release.ts' \
            ':(exclude)packages/core/content-releases/server/src/services/release-action.ts' \
            ':(exclude)packages/core/content-releases/server/src/services/__tests__/release.test.ts' \
            ':(exclude)packages/core/content-releases/server/src/services/__tests__/release-stale-status.test.ts' \
            ':(exclude)packages/core/content-releases/server/src/services/__tests__/release-action-revalidation.test.ts'

      - name: Upload exact candidate files
        if: always() && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: candidate-27722-v3
          path: |
            source/packages/core/content-releases/server/src/services/release.ts
            source/packages/core/content-releases/server/src/services/release-action.ts
            source/packages/core/content-releases/server/src/services/__tests__/release.test.ts
            source/packages/core/content-releases/server/src/services/__tests__/release-stale-status.test.ts
            source/packages/core/content-releases/server/src/services/__tests__/release-action-revalidation.test.ts
          if-no-files-found: error
