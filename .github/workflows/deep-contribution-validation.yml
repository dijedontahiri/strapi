name: Deep contribution validation

on:
  push:
    branches:
      - validate/strapi-deep-fixes-20260917

permissions:
  contents: read

concurrency:
  group: deep-contribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.repository == 'dijedontahiri/strapi'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install the repository's pinned dependencies
        run: |
          corepack enable
          yarn install --immutable
      - name: Prepare offline development dependencies
        run: |
          mkdir -p /tmp/deep-contribution
          tar -czf /tmp/deep-contribution/dependencies.tar.gz node_modules $(find packages -mindepth 3 -maxdepth 3 -type d -name node_modules)
          curl --fail --silent --show-error https://repo.yarnpkg.com/4.12.0/packages/yarnpkg-cli/bin/yarn.js -o /tmp/deep-contribution/yarn.js
          git archive --format=tar.gz --output=/tmp/deep-contribution/source.tar.gz HEAD
      - name: Snapshot public issue and pull request metadata for duplicate checking
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate 'repos/strapi/strapi/issues?state=open&per_page=100' --slurp > /tmp/deep-contribution/open-issues.json
          gh api --paginate 'repos/strapi/strapi/pulls?state=open&per_page=100' --slurp > /tmp/deep-contribution/open-prs.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: deep-contribution-environment
          path: /tmp/deep-contribution/
          retention-days: 3
