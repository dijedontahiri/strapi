name: Validate 21320 review follow-up r3

on:
  push:
    branches:
      - validate/21320-review-fix-r3-20260919

permissions:
  contents: read

env:
  SOURCE_SHA: 2cea3f4a1e4a3a6ffaa16d0feb278256883ea935
  BASE_SHA: d83af0410bf31b034b01757729f2231862ee5e87
  NX_DAEMON: 'false'
  STRAPI_TELEMETRY_DISABLED: 'true'
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  validate:
    if: github.repository == 'dijedontahiri/strapi'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2cea3f4a1e4a3a6ffaa16d0feb278256883ea935
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - name: Install and build content releases
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          corepack enable
          yarn install --immutable
          yarn nx run @strapi/content-releases:build --nx-ignore-cycles --parallel=2
      - name: Prove the edit-only permission regression on current develop
        if: matrix.node == 22
        shell: bash
        run: |
          set -euo pipefail
          source=packages/core/content-releases/admin/src/components/ReleasesPanel.tsx
          cp "$source" /tmp/fixed-panel.tsx
          trap 'cp /tmp/fixed-panel.tsx "$source"' EXIT
          git show "$BASE_SHA:$source" > "$source"
          set +e
          yarn workspace @strapi/content-releases test:front --runInBand --testPathPattern=ReleasesPanel.test.tsx --json --outputFile=/tmp/before.json
          status=$?
          set -e
          test "$status" -ne 0
          node <<'NODE'
          const assert = require('node:assert/strict');
          const result = require('/tmp/before.json');
          assert.equal(result.numRuntimeErrorTestSuites, 0);
          assert.equal(result.numFailedTests, 1);
          assert.equal(result.numPassedTests, 8);
          const test = result.testResults.flatMap((suite) => suite.assertionResults ?? []).find((entry) => entry.title === 'allows editing a release without permission to remove entries');
          assert.equal(test?.status, 'failed');
          assert.match((test?.failureMessages ?? []).join('\n'), /Release action options/);
          NODE
          cp /tmp/fixed-panel.tsx "$source"
          trap - EXIT
      - name: Run focused permission regressions
        run: yarn workspace @strapi/content-releases test:front --runInBand --testPathPattern=ReleasesPanel.test.tsx
      - name: Run complete frontend suite
        run: yarn workspace @strapi/content-releases test:front --runInBand
      - name: Run server unit suite
        run: yarn workspace @strapi/content-releases test:unit --runInBand
      - name: Check frontend types
        run: yarn workspace @strapi/content-releases test:ts:front
      - name: Lint package
        run: yarn workspace @strapi/content-releases lint
      - name: Check formatting and exact diff
        shell: bash
        run: |
          files=(packages/core/content-releases/admin/src/components/ReleasesPanel.tsx packages/core/content-releases/admin/src/components/ReleaseActionMenu.tsx packages/core/content-releases/admin/src/components/tests/ReleasesPanel.test.tsx)
          yarn prettier --check "${files[@]}"
          git diff --check "$BASE_SHA"
          actual="$(git diff --name-only "$BASE_SHA" | sort)"
          expected="$(printf '%s\n' "${files[@]}" | sort)"
          test "$actual" = "$expected"
          test "$(git status --porcelain)" = ""
