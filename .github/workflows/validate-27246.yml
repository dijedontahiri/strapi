name: Validate issue 27246 candidate

on:
  push:
    branches:
      - validation/27246-create-value-b4650d0

permissions:
  contents: read

concurrency:
  group: validate-27246-create-value-${{ github.ref }}
  cancel-in-progress: false

env:
  NX_DAEMON: 'false'
  STRAPI_TELEMETRY_DISABLED: 'true'
  EXPECTED_SOURCE: b4650d0b9ec49f95fd81901bcba90cf481012fe8
  BASE_SOURCE: d83af0410bf31b034b01757729f2231862ee5e87

jobs:
  validate:
    if: github.repository == 'dijedontahiri/strapi'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b4650d0b9ec49f95fd81901bcba90cf481012fe8
          fetch-depth: 16
          persist-credentials: false

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}

      - name: Install pinned dependencies
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          git cat-file -e "$BASE_SOURCE^{commit}"
          corepack enable
          yarn install --immutable

      - name: Build content-manager and workspace dependencies
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: yarn nx run @strapi/content-manager:build --nx-ignore-cycles --parallel=2

      - name: Prove regression against current develop
        if: matrix.node == 22
        shell: bash
        run: |
          set -euo pipefail
          source_file='packages/core/content-manager/admin/src/pages/EditView/components/FormInputs/Relations/Relations.tsx'
          test_pattern='Relations.create.test.tsx'
          cp "$source_file" /tmp/fixed-relations.tsx
          trap 'cp /tmp/fixed-relations.tsx "$source_file"' EXIT
          git show "$BASE_SOURCE:$source_file" > "$source_file"
          set +e
          yarn workspace @strapi/content-manager test:front --runInBand --testPathPattern="$test_pattern" --json --outputFile=/tmp/27246-before.json
          status=$?
          set -e
          test "$status" -eq 1
          node - <<'NODE'
          const result = require('/tmp/27246-before.json');
          if (
            result.numFailedTests !== 1 ||
            result.numPassedTests !== 0 ||
            result.numTotalTests !== 1 ||
            result.numTotalTestSuites !== 1
          ) {
            throw new Error(`Unexpected baseline result: ${JSON.stringify({
              failed: result.numFailedTests,
              passed: result.numPassedTests,
              total: result.numTotalTests,
              suites: result.numTotalTestSuites,
            })}`);
          }
          NODE
          cp /tmp/fixed-relations.tsx "$source_file"
          trap - EXIT

      - name: Focused regression
        run: yarn workspace @strapi/content-manager test:front --runInBand --testPathPattern=Relations.create.test.tsx

      - name: Complete content-manager frontend suite
        run: yarn workspace @strapi/content-manager test:front --runInBand

      - name: Content-manager frontend TypeScript
        run: yarn workspace @strapi/content-manager test:ts:front

      - name: Content-manager lint
        run: yarn workspace @strapi/content-manager lint

      - name: Changed-file formatting
        run: >-
          yarn prettier --check
          packages/core/content-manager/admin/src/pages/EditView/components/FormInputs/Relations/Relations.tsx
          packages/core/content-manager/admin/src/pages/EditView/components/FormInputs/Relations/tests/Relations.create.test.tsx

      - name: Verify exact source and focused diff
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --check "$BASE_SOURCE" HEAD
          actual="$(git diff --name-only "$BASE_SOURCE" HEAD | sort)"
          expected="$(printf '%s\n' \
            packages/core/content-manager/admin/src/pages/EditView/components/FormInputs/Relations/Relations.tsx \
            packages/core/content-manager/admin/src/pages/EditView/components/FormInputs/Relations/tests/Relations.create.test.tsx | sort)"
          test "$actual" = "$expected"
