name: validate-24140-component-name-reuse

on:
  push:
    branches:
      - validation/24140-component-name-reuse

permissions:
  contents: read

jobs:
  content-type-builder:
    if: github.repository == 'dijedontahiri/strapi'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6c79ded48f17cacdd242f669bc8577eb2191b9d5
          fetch-depth: 0
      - name: Verify candidate source
        run: |
          test "$(git rev-parse HEAD)" = "6c79ded48f17cacdd242f669bc8577eb2191b9d5"
          test -z "$(git status --porcelain=v1)"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Baseline negative controls
        if: matrix.node == 22
        shell: bash
        run: |
          git checkout d83af0410bf31b034b01757729f2231862ee5e87 -- \
            packages/core/content-type-builder/server/src/services/schema-builder/component-builder.ts \
            packages/core/content-type-builder/server/src/services/schema-builder/schema-handler.ts \
            packages/core/content-type-builder/admin/src/components/FormModal/component/createComponentSchema.ts
          set +e
          yarn workspace @strapi/content-type-builder test:unit:vitest server/src/services/schema-builder/__tests__/component-builder.vitest.test.ts server/src/services/schema-builder/__tests__/schema-handler.vitest.test.ts
          server_status=$?
          yarn workspace @strapi/content-type-builder test:front --runInBand admin/src/components/FormModal/forms/tests/component.test.ts
          admin_status=$?
          set -e
          git checkout 6c79ded48f17cacdd242f669bc8577eb2191b9d5 -- \
            packages/core/content-type-builder/server/src/services/schema-builder/component-builder.ts \
            packages/core/content-type-builder/server/src/services/schema-builder/schema-handler.ts \
            packages/core/content-type-builder/admin/src/components/FormModal/component/createComponentSchema.ts
          if [ "$server_status" -eq 0 ]; then
            echo "Server regression unexpectedly passes on develop baseline"
            exit 1
          fi
          if [ "$admin_status" -eq 0 ]; then
            echo "Admin regression unexpectedly passes on develop baseline"
            exit 1
          fi
      - name: Focused server regressions
        run: yarn workspace @strapi/content-type-builder test:unit:vitest server/src/services/schema-builder/__tests__/component-builder.vitest.test.ts server/src/services/schema-builder/__tests__/schema-handler.vitest.test.ts
      - name: Focused admin regression
        run: yarn workspace @strapi/content-type-builder test:front --runInBand admin/src/components/FormModal/forms/tests/component.test.ts
      - name: Full server unit suite
        run: yarn workspace @strapi/content-type-builder test:unit:vitest
      - name: Full frontend unit suite
        run: yarn workspace @strapi/content-type-builder test:front --runInBand
      - name: Server TypeScript
        run: yarn workspace @strapi/content-type-builder test:ts:back
      - name: Frontend TypeScript
        run: yarn workspace @strapi/content-type-builder test:ts:front
      - name: Content Type Builder lint
        run: yarn workspace @strapi/content-type-builder lint
      - name: Changed-file formatting
        run: >-
          yarn prettier --check
          packages/core/content-type-builder/server/src/services/schema-builder/component-builder.ts
          packages/core/content-type-builder/server/src/services/schema-builder/schema-handler.ts
          packages/core/content-type-builder/server/src/services/schema-builder/__tests__/component-builder.vitest.test.ts
          packages/core/content-type-builder/server/src/services/schema-builder/__tests__/schema-handler.vitest.test.ts
          packages/core/content-type-builder/admin/src/components/FormModal/component/createComponentSchema.ts
          packages/core/content-type-builder/admin/src/components/FormModal/forms/tests/component.test.ts
      - name: Verify exact source and clean tree
        run: |
          test "$(git rev-parse HEAD)" = "6c79ded48f17cacdd242f669bc8577eb2191b9d5"
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"
