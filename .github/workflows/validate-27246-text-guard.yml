name: Validate #27246 relation create text guard

on:
  push:
    branches:
      - validate/27246-text-guard-20260920

permissions:
  contents: read

concurrency:
  group: validate-27246-text-guard-${{ github.ref }}
  cancel-in-progress: false

env:
  NX_DAEMON: 'false'
  STRAPI_TELEMETRY_DISABLED: 'true'
  SOURCE_SHA: d83af0410bf31b034b01757729f2231862ee5e87
  RECIPE_SHA: 90267da659c965011bddad3ec35cd7decc29a500

jobs:
  probe:
    if: github.repository == 'dijedontahiri/strapi'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d83af0410bf31b034b01757729f2231862ee5e87
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Retrieve prior regression recipe
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags origin "$RECIPE_SHA" --depth=1
          git show "$RECIPE_SHA:.github/validation/relation-creation.py" > "$RUNNER_TEMP/relation-creation.py"
      - name: Install and build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          corepack enable
          yarn install --immutable
          yarn nx run @strapi/content-manager:build --nx-ignore-cycles --parallel=2
      - name: Add regression coverage
        run: |
          python3 "$RUNNER_TEMP/relation-creation.py" tests
          yarn prettier --write packages/core/content-manager/admin/src/pages/EditView/components/FormInputs/Relations/tests/RelationCreation.test.tsx
      - name: Prove current develop fails the exact regression family
        shell: bash
        run: |
          set -euo pipefail
          set +e
          yarn workspace @strapi/content-manager test:front --runInBand --testPathPattern=Relations/tests/RelationCreation.test.tsx --json --outputFile=/tmp/before.json >/tmp/before.log 2>&1
          status=$?
          set -e
          test "$status" -eq 1
          node <<'NODE'
          const r=require('/tmp/before.json');
          const cases=r.testResults.flatMap(t=>t.assertionResults);
          const creation=cases.filter(t=>t.fullName.includes('without connecting text'));
          const numeric=cases.filter(t=>t.fullName.includes('numeric label'));
          if (cases.length !== 10 || creation.length !== 5 || numeric.length !== 2 || r.numPassedTests !== 3 || r.numFailedTests !== 7) {
            throw new Error(`unexpected baseline counts: ${JSON.stringify({cases:cases.length, creation:creation.length, numeric:numeric.length, passed:r.numPassedTests, failed:r.numFailedTests})}`);
          }
          if (!creation.every(t=>t.status==='failed' && t.failureMessages.some(m=>m.includes("You've tried to add a relation")))) {
            throw new Error('creation failures did not reproduce expected unknown-relation guard');
          }
          if (!numeric.every(t=>t.status==='failed' && t.failureMessages.some(m=>m.includes('Received:') && m.includes('[1]')))) {
            throw new Error('numeric-label failures did not reproduce accidental connection');
          }
          NODE
      - name: Apply narrow free-text guard candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('packages/core/content-manager/admin/src/pages/EditView/components/FormInputs/Relations/Relations.tsx')
          s=p.read_text()
          old='''          onChange={handleChange}\n          onTextValueChange={(text) => {\n'''
          new='''          onChange={(relationId) => {\n            if (relationId === textValue) {\n              return;\n            }\n\n            handleChange(relationId);\n          }}\n          onTextValueChange={(text) => {\n'''
          if s.count(old) != 1:
              raise SystemExit('candidate insertion marker missing or ambiguous')
          p.write_text(s.replace(old,new,1))
          PY
          yarn prettier --write packages/core/content-manager/admin/src/pages/EditView/components/FormInputs/Relations/Relations.tsx
      - name: Run relation creation and existing relation suites
        run: yarn workspace @strapi/content-manager test:front --runInBand --testPathPattern=FormInputs/Relations/tests
      - name: Run complete content-manager frontend suite
        run: yarn workspace @strapi/content-manager test:front --runInBand
      - name: Type-check content-manager frontend
        run: yarn workspace @strapi/content-manager test:ts:front
      - name: Lint content-manager
        run: yarn workspace @strapi/content-manager lint
      - name: Check candidate formatting and scope
        run: |
          yarn prettier --check packages/core/content-manager/admin/src/pages/EditView/components/FormInputs/Relations/Relations.tsx packages/core/content-manager/admin/src/pages/EditView/components/FormInputs/Relations/tests/RelationCreation.test.tsx
          git diff --check
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
