name: Content type options follow-up validation

on:
  push:
    branches:
      - validate/21753-options-followup-20260918

permissions:
  contents: read

env:
  NX_DAEMON: 'false'
  STRAPI_TELEMETRY_DISABLED: 'true'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f7d0a95b507614965b2d0550b832d216b5eff920
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - name: Install pinned dependencies
        run: |
          corepack enable
          yarn install --immutable
      - name: Build package and dependencies
        run: yarn nx run @strapi/content-type-builder:build --nx-ignore-cycles --parallel=2
      - name: Prove the review regression against the previous PR head
        if: matrix.node == 22
        shell: bash
        run: |
          source=packages/core/content-type-builder/server/src/services/schema-builder/content-type-builder.ts
          trap 'git restore -- "$source"' EXIT
          git show c66d527180130152a2bd47a643ffae684123db16:"$source" > "$source"
          set +e
          yarn workspace @strapi/content-type-builder test:unit:vitest server/src/services/schema-builder/__tests__/content-type-options.vitest.test.ts --reporter=json --outputFile=/tmp/options-before.json
          status=$?
          set -e
          test "$status" -ne 0
          node -e "const r=require('/tmp/options-before.json'); const failed=(r.numFailedTests ?? r.numFailedTestSuites); if(!(failed>=1)) throw Error('Expected the omitted draftAndPublish regression to fail against the previous PR head'); console.log('Previous-head regression confirmed');"
          git restore -- "$source"
          trap - EXIT
      - name: Run complete package Vitest suite
        run: yarn workspace @strapi/content-type-builder test:unit:vitest
      - name: Type-check server
        if: success() || failure()
        run: yarn workspace @strapi/content-type-builder test:ts:back
      - name: Lint package
        if: success() || failure()
        run: yarn workspace @strapi/content-type-builder lint
      - name: Check changed-file formatting
        if: success() || failure()
        run: yarn prettier --check packages/core/content-type-builder/server/src/services/schema-builder/content-type-builder.ts packages/core/content-type-builder/server/src/services/schema-builder/__tests__/content-type-options.vitest.test.ts
      - name: Check follow-up diff whitespace
        if: success() || failure()
        run: git diff --check c66d527180130152a2bd47a643ffae684123db16 HEAD
