name: Validate duplicate locale deletion final green

on:
  push:
    branches:
      - validate/27656-final-green-20260918

permissions:
  contents: read

env:
  NX_DAEMON: 'false'
  STRAPI_TELEMETRY_DISABLED: 'true'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f26f7e3fab95f1530bcc75eefb2349d706c96972
          fetch-depth: 20
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - name: Verify exact submitted source and comparison base
        run: |
          test "$(git rev-parse HEAD)" = "f26f7e3fab95f1530bcc75eefb2349d706c96972"
          git cat-file -e 5fcd743f4965ed3efef854b6c36b60bee8fae29b^{commit}
          test "$(git diff --name-only 5fcd743f4965ed3efef854b6c36b60bee8fae29b..HEAD | wc -l)" -eq 3
      - name: Install pinned dependencies
        run: |
          corepack enable
          yarn install --immutable
      - name: Build i18n package and dependencies
        run: yarn nx run @strapi/i18n:build --nx-ignore-cycles --parallel=2
      - name: Prove upstream deletion logic fails the focused regression
        if: matrix.node == 22
        shell: bash
        run: |
          source=packages/plugins/i18n/server/src/services/locales.ts
          trap 'git restore -- "$source"' EXIT
          git show 5fcd743f4965ed3efef854b6c36b60bee8fae29b:"$source" > "$source"
          set +e
          yarn workspace @strapi/i18n test:unit --runInBand --testPathPattern=locales-duplicate-delete.test.ts --json --outputFile=/tmp/i18n-before.json
          status=$?
          set -e
          test "$status" -ne 0
          node -e "const r=require('/tmp/i18n-before.json'); if(!(r.numFailedTests>=1) || r.numTotalTestSuites!==1) throw Error('Expected duplicate-locale regression to fail against upstream'); console.log('Upstream regression confirmed:', r.numFailedTests, 'failed');"
          git restore -- "$source"
          trap - EXIT
      - name: Run focused duplicate-locale regression
        run: yarn workspace @strapi/i18n test:unit --runInBand --testPathPattern=locales-duplicate-delete.test.ts
      - name: Run complete i18n unit suite
        run: yarn workspace @strapi/i18n test:unit --runInBand
      - name: Rebuild i18n types on final source
        run: yarn workspace @strapi/i18n build:types
      - name: Lint i18n package
        run: yarn workspace @strapi/i18n lint
      - name: Check changed-file formatting
        run: yarn prettier --check packages/plugins/i18n/server/src/services/locales.ts packages/plugins/i18n/server/src/services/__tests__/locales.test.ts packages/plugins/i18n/server/src/services/__tests__/locales-duplicate-delete.test.ts
      - name: Verify final product diff
        run: |
          git diff --check 5fcd743f4965ed3efef854b6c36b60bee8fae29b..HEAD
          test "$(git diff --name-only 5fcd743f4965ed3efef854b6c36b60bee8fae29b..HEAD | wc -l)" -eq 3
          git diff --exit-code -- packages/plugins/i18n/server/src/services/locales.ts packages/plugins/i18n/server/src/services/__tests__/locales.test.ts packages/plugins/i18n/server/src/services/__tests__/locales-duplicate-delete.test.ts
