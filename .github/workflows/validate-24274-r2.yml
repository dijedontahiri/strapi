name: Validate #24274 AI enum values r2

on:
  push:
    branches:
      - validate/24274-ai-enum-values-r2-20260920

permissions:
  contents: read

env:
  NX_DAEMON: 'false'
  STRAPI_TELEMETRY_DISABLED: 'true'

jobs:
  validate:
    if: github.repository == 'dijedontahiri/strapi'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: 3156385a39b141542052c87da451f44ab9370634
          fetch-depth: 0
      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Verify exact candidate
        run: test "$(git rev-parse HEAD)" = "3156385a39b141542052c87da451f44ab9370634"
      - name: Build Content Type Builder and workspace dependencies
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: yarn nx run @strapi/content-type-builder:build --nx-ignore-cycles --parallel=2
      - name: Prove baseline regression fails for the intended assertion
        if: matrix.node == 22
        shell: bash
        run: |
          set -euo pipefail
          TEST_PATH='packages/core/content-type-builder/admin/src/components/AIChat/lib/transforms/schemas/tests/toCTB.enumeration.test.ts'
          SOURCE_PATH='packages/core/content-type-builder/admin/src/components/AIChat/lib/transforms/schemas/toCTB.ts'
          cp "$SOURCE_PATH" /tmp/toCTB.ts
          trap 'cp /tmp/toCTB.ts "$SOURCE_PATH"' EXIT
          git show d83af0410bf31b034b01757729f2231862ee5e87:"$SOURCE_PATH" > "$SOURCE_PATH"
          set +e
          yarn workspace @strapi/content-type-builder test:front --runInBand "$TEST_PATH" --json --outputFile=/tmp/enum-before.json
          status=$?
          set -e
          test "$status" -eq 1
          node - <<'NODE'
          const result = require('/tmp/enum-before.json');
          const failed = result.testResults.flatMap((suite) =>
            suite.assertionResults.filter((test) => test.status === 'failed')
          );
          if (result.numFailedTests !== 1 || failed.length !== 1 || !failed[0].title.includes('makes numeric-leading generated enum values')) {
            throw new Error(`Unexpected baseline result: ${JSON.stringify({ failed: result.numFailedTests, failedTitles: failed.map((test) => test.title) })}`);
          }
          NODE
          cp /tmp/toCTB.ts "$SOURCE_PATH"
          trap - EXIT
      - name: Focused regression
        run: yarn workspace @strapi/content-type-builder test:front --runInBand packages/core/content-type-builder/admin/src/components/AIChat/lib/transforms/schemas/tests/toCTB.enumeration.test.ts
      - name: Content Type Builder frontend tests
        if: matrix.node == 22
        run: yarn workspace @strapi/content-type-builder test:front --runInBand
      - name: TypeScript frontend
        run: yarn workspace @strapi/content-type-builder test:ts:front
      - name: ESLint affected files
        if: matrix.node == 22
        run: yarn eslint packages/core/content-type-builder/admin/src/components/AIChat/lib/transforms/schemas/toCTB.ts packages/core/content-type-builder/admin/src/components/AIChat/lib/transforms/schemas/tests/toCTB.enumeration.test.ts --max-warnings=0
      - name: Prettier affected files
        if: matrix.node == 22
        run: yarn prettier --check packages/core/content-type-builder/admin/src/components/AIChat/lib/transforms/schemas/toCTB.ts packages/core/content-type-builder/admin/src/components/AIChat/lib/transforms/schemas/tests/toCTB.enumeration.test.ts
      - name: Verify clean candidate tree
        run: |
          test "$(git rev-parse HEAD)" = "3156385a39b141542052c87da451f44ab9370634"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          actual="$(git diff --name-only d83af0410bf31b034b01757729f2231862ee5e87 HEAD | sort)"
          expected="$(printf '%s\n' packages/core/content-type-builder/admin/src/components/AIChat/lib/transforms/schemas/toCTB.ts packages/core/content-type-builder/admin/src/components/AIChat/lib/transforms/schemas/tests/toCTB.enumeration.test.ts | sort)"
          test "$actual" = "$expected"
