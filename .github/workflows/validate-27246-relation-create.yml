name: Validate relation create-on-the-fly fix

on:
  push:
    branches:
      - fix/27246-relation-create-search-text

permissions:
  contents: read

concurrency:
  group: validate-relation-create-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5fcd743f4965ed3efef854b6c36b60bee8fae29b
          persist-credentials: false
      - name: Verify source revision
        run: test "$(git rev-parse HEAD)" = "5fcd743f4965ed3efef854b6c36b60bee8fae29b"
