name: Validate #21456 formatting probe

on:
  push:
    branches:
      - validate/21456-format-probe-20260920

permissions:
  contents: read

jobs:
  format:
    if: github.repository == 'dijedontahiri/strapi'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d066933ffe5d3ab3b36e6b92a194ac1575df2d69
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable
      - name: Show formatter diff
        shell: bash
        run: |
          set -euo pipefail
          yarn prettier --write packages/core/data-transfer/src/strapi/providers/local-source/assets.ts packages/core/data-transfer/src/strapi/providers/local-source/__tests__/assets.test.ts
          git diff -- packages/core/data-transfer/src/strapi/providers/local-source/assets.ts packages/core/data-transfer/src/strapi/providers/local-source/__tests__/assets.test.ts
