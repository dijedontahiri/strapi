name: Validate #24394 custom field registration

on:
  push:
    branches:
      - validate/24394-custom-field-registration-20260920

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'dijedontahiri/strapi'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: 9bf70558e673e88241acdf28bc538b398e3e889b
          fetch-depth: 0
      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Verify exact candidate
        run: test "$(git rev-parse HEAD)" = "9bf70558e673e88241acdf28bc538b398e3e889b"
      - name: Prove baseline regression fails
        if: matrix.node == 22
        shell: bash
        run: |
          set -euo pipefail
          TEST_PATH='packages/core/core/src/core-api/routes/validation/__tests__/mappers.test.ts'
          cp "$TEST_PATH" /tmp/mappers.test.ts
          git checkout d83af0410bf31b034b01757729f2231862ee5e87 -- packages/core/core/src/core-api/routes/validation/mappers.ts
          cp /tmp/mappers.test.ts "$TEST_PATH"
          set +e
          yarn workspace @strapi/core test:unit --runInBand "$TEST_PATH"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Baseline unexpectedly passed regression'
            exit 1
          fi
          git checkout 9bf70558e673e88241acdf28bc538b398e3e889b -- packages/core/core/src/core-api/routes/validation/mappers.ts "$TEST_PATH"
      - name: Focused regression
        run: yarn workspace @strapi/core test:unit --runInBand packages/core/core/src/core-api/routes/validation/__tests__/mappers.test.ts
      - name: Core unit tests
        if: matrix.node == 22
        run: yarn workspace @strapi/core test:unit --runInBand
      - name: Core TypeScript
        run: yarn workspace @strapi/core test:ts
      - name: ESLint affected files
        if: matrix.node == 22
        run: yarn eslint packages/core/core/src/core-api/routes/validation/mappers.ts packages/core/core/src/core-api/routes/validation/__tests__/mappers.test.ts --max-warnings=0
      - name: Prettier affected files
        if: matrix.node == 22
        run: yarn prettier --check packages/core/core/src/core-api/routes/validation/mappers.ts packages/core/core/src/core-api/routes/validation/__tests__/mappers.test.ts
      - name: Verify clean candidate tree
        run: |
          test "$(git rev-parse HEAD)" = "9bf70558e673e88241acdf28bc538b398e3e889b"
          test -z "$(git status --porcelain)"
