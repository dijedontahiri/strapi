name: Validate #24394 custom field registration

on:
  push:
    branches:
      - validate/24394-custom-field-registration-20260920

permissions:
  contents: read

env:
  NX_DAEMON: 'false'
  STRAPI_TELEMETRY_DISABLED: 'true'

jobs:
  validate:
    if: github.repository == 'dijedontahiri/strapi'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: 9bf70558e673e88241acdf28bc538b398e3e889b
          fetch-depth: 0
      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Verify exact candidate
        run: test "$(git rev-parse HEAD)" = "9bf70558e673e88241acdf28bc538b398e3e889b"
      - name: Build core and workspace dependencies
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: yarn nx run @strapi/core:build --nx-ignore-cycles --parallel=2
      - name: Prove baseline regression fails for custom-field resolution
        if: matrix.node == 22
        shell: bash
        run: |
          set -euo pipefail
          TEST_PATH='packages/core/core/src/core-api/routes/validation/__tests__/mappers.test.ts'
          SOURCE_PATH='packages/core/core/src/core-api/routes/validation/mappers.ts'
          cp "$SOURCE_PATH" /tmp/mappers.ts
          trap 'cp /tmp/mappers.ts "$SOURCE_PATH"' EXIT
          git show d83af0410bf31b034b01757729f2231862ee5e87:"$SOURCE_PATH" > "$SOURCE_PATH"
          set +e
          yarn workspace @strapi/core test:unit --runInBand "$TEST_PATH" --json --outputFile=/tmp/custom-field-before.json
          status=$?
          set -e
          test "$status" -eq 1
          node - <<'NODE'
          const result = require('/tmp/custom-field-before.json');
          const failed = result.testResults.flatMap((suite) =>
            suite.assertionResults.filter((test) => test.status === 'failed')
          );
          if (result.numFailedTests !== 2 || failed.length !== 2 || failed.some((test) => !test.title.includes('defers') || !test.title.includes('custom field resolution until validation'))) {
            throw new Error(`Unexpected baseline result: ${JSON.stringify({ failed: result.numFailedTests, failedTitles: failed.map((test) => test.title) })}`);
          }
          NODE
          cp /tmp/mappers.ts "$SOURCE_PATH"
          trap - EXIT
      - name: Focused regression
        run: yarn workspace @strapi/core test:unit --runInBand packages/core/core/src/core-api/routes/validation/__tests__/mappers.test.ts
      - name: Route validation unit suite
        if: matrix.node == 22
        run: yarn jest --config packages/core/core/jest.config.js packages/core/core/src/core-api/routes/validation/__tests__ --runInBand
      - name: Core TypeScript
        run: yarn workspace @strapi/core test:ts
      - name: ESLint affected files
        if: matrix.node == 22
        run: yarn eslint packages/core/core/src/core-api/routes/validation/mappers.ts packages/core/core/src/core-api/routes/validation/__tests__/mappers.test.ts --max-warnings=0
      - name: Prettier affected files
        if: matrix.node == 22
        run: yarn prettier --check packages/core/core/src/core-api/routes/validation/mappers.ts packages/core/core/src/core-api/routes/validation/__tests__/mappers.test.ts
      - name: Verify clean candidate tree
        run: |
          test "$(git rev-parse HEAD)" = "9bf70558e673e88241acdf28bc538b398e3e889b"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          actual="$(git diff --name-only d83af0410bf31b034b01757729f2231862ee5e87 HEAD | sort)"
          expected="$(printf '%s\n' packages/core/core/src/core-api/routes/validation/mappers.ts packages/core/core/src/core-api/routes/validation/__tests__/mappers.test.ts | sort)"
          test "$actual" = "$expected"
