name: Repair duplicate-locale lint regression

on:
  push:
    branches:
      - validate/27656-concurrency-lock

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/27656-duplicate-locale-delete
          fetch-depth: 5
      - name: Fix transaction test helper lint
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('packages/plugins/i18n/server/src/services/__tests__/locales.test.ts')
          text = path.read_text()
          old = "transaction: jest.fn(async (callback: any) => callback({ trx })),"
          new = "transaction: jest.fn(async (handler: any) => handler({ trx })),"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one target, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          test "$(git diff --numstat -- packages/plugins/i18n/server/src/services/__tests__/locales.test.ts | awk '{print $1+$2}')" -eq 2
          git diff --check
      - name: Commit and push focused repair
        shell: bash
        run: |
          git config user.name 'Dijedon'
          git config user.email '99071957+dijedontahiri@users.noreply.github.com'
          git add packages/plugins/i18n/server/src/services/__tests__/locales.test.ts
          git commit -m 'test(i18n): satisfy transaction mock lint'
          git push origin HEAD:fix/27656-duplicate-locale-delete
