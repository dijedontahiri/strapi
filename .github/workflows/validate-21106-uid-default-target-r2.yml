name: Apply UID clear-target review fix

on:
  push:
    branches:
      - validate/21106-uid-default-target-r2-20260919

permissions:
  contents: write

concurrency:
  group: apply-21106-uid-clear-target-${{ github.ref }}
  cancel-in-progress: false

env:
  TARGET_BRANCH: fix-21106-uid-default-target
  EXPECTED_OLD_HEAD: 34d87677ab905a216a5b34216c6621e612b3ebbb

jobs:
  apply:
    if: github.repository == 'dijedontahiri/strapi'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 8
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Verify inspected head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_OLD_HEAD"
      - name: Apply review correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          reducer = Path('packages/core/content-type-builder/admin/src/components/FormModal/reducer.ts')
          text = reducer.read_text()
          old = """      if (\n        hasDefaultValue &&\n        obj.type === 'uid' &&\n        keys.length === 1 &&\n        keys[0] === 'targetField' &&\n        typeof value === 'string' &&\n        value !== ''\n      ) {\n        delete state.modifiedData.default;\n      }\n\n      set(state, ['modifiedData', ...keys], value);\n"""
          new = """      const isUidTargetFieldChange =\n        obj.type === 'uid' && keys.length === 1 && keys[0] === 'targetField';\n\n      if (\n        hasDefaultValue &&\n        isUidTargetFieldChange &&\n        typeof value === 'string' &&\n        value !== ''\n      ) {\n        delete state.modifiedData.default;\n      }\n\n      set(\n        state,\n        ['modifiedData', ...keys],\n        isUidTargetFieldChange && value === '' ? null : value\n      );\n"""
          if old not in text:
              raise SystemExit('expected reducer block not found')
          reducer.write_text(text.replace(old, new, 1))

          test = Path('packages/core/content-type-builder/admin/src/components/FormModal/tests/reducer.uid.test.ts')
          text = test.read_text()
          old = """    expect(nextState.modifiedData).toEqual({\n      type: 'uid',\n      name: 'slug',\n      default: 'fallback-slug',\n      targetField: '',\n    });\n"""
          new = """    expect(nextState.modifiedData).toEqual({\n      type: 'uid',\n      name: 'slug',\n      default: 'fallback-slug',\n      targetField: null,\n    });\n"""
          if old not in text:
              raise SystemExit('expected clear-target assertion not found')
          test.write_text(text.replace(old, new, 1))
          PY
      - name: Install pinned dependencies
        run: |
          corepack enable
          yarn install --immutable
      - name: Build content-type-builder and dependencies
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: yarn nx run @strapi/content-type-builder:build --nx-ignore-cycles --parallel=2
      - name: Run focused regression
        run: yarn workspace @strapi/content-type-builder test:front --runInBand --testPathPattern=reducer.uid.test.ts
      - name: Check formatting and diff
        run: |
          yarn prettier --check packages/core/content-type-builder/admin/src/components/FormModal/reducer.ts packages/core/content-type-builder/admin/src/components/FormModal/tests/reducer.uid.test.ts
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' packages/core/content-type-builder/admin/src/components/FormModal/reducer.ts packages/core/content-type-builder/admin/src/components/FormModal/tests/reducer.uid.test.ts | sort)"
          test "$actual" = "$expected"
      - name: Commit and push exact correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Dijedon'
          git config user.email '99071957+dijedontahiri@users.noreply.github.com'
          git add packages/core/content-type-builder/admin/src/components/FormModal/reducer.ts packages/core/content-type-builder/admin/src/components/FormModal/tests/reducer.uid.test.ts
          git commit -m 'fix(content-type-builder): normalize cleared UID target'
          git push origin HEAD:"$TARGET_BRANCH"
