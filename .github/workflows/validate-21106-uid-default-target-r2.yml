name: Validate UID target default reset r2

on:
  push:
    branches:
      - validate/21106-uid-default-target-r2-20260919

permissions:
  contents: read

concurrency:
  group: validate-21106-uid-default-target-r2-${{ github.ref }}
  cancel-in-progress: false

env:
  NX_DAEMON: 'false'
  STRAPI_TELEMETRY_DISABLED: 'true'
  EXPECTED_SOURCE: 34d87677ab905a216a5b34216c6621e612b3ebbb
  BASE_SOURCE: d83af0410bf31b034b01757729f2231862ee5e87

jobs:
  ctb-front:
    if: github.repository == 'dijedontahiri/strapi'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 34d87677ab905a216a5b34216c6621e612b3ebbb
          fetch-depth: 8
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - name: Install pinned dependencies
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          git cat-file -e "$BASE_SOURCE^{commit}"
          corepack enable
          yarn install --immutable
      - name: Build content-type-builder and workspace dependencies
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: yarn nx run @strapi/content-type-builder:build --nx-ignore-cycles --parallel=2
      - name: Prove the UID default regression against current develop
        if: matrix.node == 22
        shell: bash
        run: |
          set -euo pipefail
          source=packages/core/content-type-builder/admin/src/components/FormModal/reducer.ts
          cp "$source" /tmp/fixed-reducer.ts
          trap 'cp /tmp/fixed-reducer.ts "$source"' EXIT
          git show "$BASE_SOURCE:$source" > "$source"
          set +e
          yarn workspace @strapi/content-type-builder test:front --runInBand --testPathPattern=reducer.uid.test.ts --json --outputFile=/tmp/uid-default-before.json
          status=$?
          set -e
          test "$status" -eq 1
          node - <<'NODE'
          const result = require('/tmp/uid-default-before.json');
          if (
            result.numFailedTests !== 1 ||
            result.numPassedTests !== 1 ||
            result.numTotalTests !== 2 ||
            result.numTotalTestSuites !== 1
          ) {
            throw new Error(`Unexpected baseline result: ${JSON.stringify({
              failed: result.numFailedTests,
              passed: result.numPassedTests,
              total: result.numTotalTests,
              suites: result.numTotalTestSuites,
            })}`);
          }
          NODE
          cp /tmp/fixed-reducer.ts "$source"
          trap - EXIT
      - name: Run focused frontend regression test
        run: yarn workspace @strapi/content-type-builder test:front --runInBand --testPathPattern=reducer.uid.test.ts
      - name: Run complete content-type-builder frontend suite
        run: yarn workspace @strapi/content-type-builder test:front --runInBand
      - name: Type-check content-type-builder frontend
        run: yarn workspace @strapi/content-type-builder test:ts:front
      - name: Lint content-type-builder package
        run: yarn workspace @strapi/content-type-builder lint
      - name: Check changed-file formatting
        run: yarn prettier --check packages/core/content-type-builder/admin/src/components/FormModal/reducer.ts packages/core/content-type-builder/admin/src/components/FormModal/tests/reducer.uid.test.ts
      - name: Verify exact source and focused diff
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --check "$BASE_SOURCE" HEAD
          actual="$(git diff --name-only "$BASE_SOURCE" HEAD | sort)"
          expected="$(printf '%s\n' packages/core/content-type-builder/admin/src/components/FormModal/reducer.ts packages/core/content-type-builder/admin/src/components/FormModal/tests/reducer.uid.test.ts | sort)"
          test "$actual" = "$expected"
