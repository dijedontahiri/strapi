name: Contribution validation

on:
  push:
    branches:
      - validate/strapi-fixes-20260917

permissions:
  contents: read

concurrency:
  group: contribution-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript-utils:
    if: github.repository == 'dijedontahiri/strapi'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install the pinned workspace dependencies
        run: |
          corepack enable
          yarn install --immutable
      - name: Prepare reproducible source and formatting artifacts
        run: |
          mkdir -p /tmp/strapi-contribution-artifacts
          git archive --format=tar.gz --output=/tmp/strapi-contribution-artifacts/source.tar.gz HEAD
          tar -czf /tmp/strapi-contribution-artifacts/compiler-formatter.tar.gz node_modules/typescript node_modules/prettier
          yarn prettier packages/utils/typescript/src/__tests__/server-config.test.ts > /tmp/strapi-contribution-artifacts/server-config.formatted.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: contribution-source
          path: /tmp/strapi-contribution-artifacts/
          retention-days: 3
      - name: Run the TypeScript utilities unit suite
        run: yarn workspace @strapi/typescript-utils test:unit --runInBand
      - name: Check TypeScript utilities types
        run: yarn workspace @strapi/typescript-utils test:ts
      - name: Check changed-file formatting
        run: |
          yarn prettier --check packages/utils/typescript/tsconfigs/server.json packages/utils/typescript/src/__tests__/server-config.test.ts
      - name: Lint TypeScript utilities
        if: success() || failure()
        run: yarn workspace @strapi/typescript-utils lint
