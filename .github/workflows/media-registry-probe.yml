name: Media type compatibility reproduction
on:
  push:
    branches: [validate/media-registry-probe-20260917]
permissions:
  contents: read
jobs:
  reproduce:
    if: github.repository == 'dijedontahiri/strapi'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NX_DAEMON: 'false'
      HUSKY: '0'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d20c31a9d383ffffa5de4737aefe2d0fbca8d8e6
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install and build real workspace types
        run: |
          corepack enable
          yarn install --immutable
          yarn nx run @strapi/types:build:types --nx-ignore-cycles --parallel=2
      - name: Create isolated compiler fixtures
        run: |
          mkdir -p packages/core/types/tests/media-probe
          cat > packages/core/types/tests/media-probe/tsconfig.json <<'EOF'
          {
            "extends": "../../tsconfig.json",
            "include": ["fixture.ts"],
            "exclude": ["../../src/__tests__"],
            "compilerOptions": { "noEmit": true, "skipLibCheck": false }
          }
          EOF
          cat > packages/core/types/tests/media-probe/fixture.ts <<'EOF'
          import type * as Schema from '../../src/schema';
          import type * as Struct from '../../src/struct';
          interface Article extends Struct.CollectionTypeSchema {
            attributes: {
              title: Schema.Attribute.String;
              cover: Schema.Attribute.Media<'images'>;
            };
          }
          declare module '../../src/public/registries' {
            interface ContentTypeSchemas {
              'api::media-probe.media-probe': Article;
            }
          }
          export type Media = Schema.Attribute.MediaValue<false>;
          EOF
          # Fixture is two directories below tests; source is three levels up.
          sed -i "s|'../../src/|'../../src/|g" packages/core/types/tests/media-probe/fixture.ts
          # Paths from tests/media-probe to src are ../../src, as above.
      - name: Reproduce missing upload registry
        id: missing
        shell: bash
        run: |
          set +e
          yarn workspace @strapi/types exec tsc -p tests/media-probe/tsconfig.json --pretty false > /tmp/missing-registry.log 2>&1
          result=$?
          set -e
          cat /tmp/missing-registry.log
          test "$result" -ne 0
          grep -E 'media.ts\([0-9]+,[0-9]+\): error TS2344' /tmp/missing-registry.log
          echo 'Confirmed: the current PR rejects a valid registry without plugin::upload.file.'
      - name: Reproduce numeric media input rejection with upload registered
        if: success() || failure()
        shell: bash
        run: |
          cp packages/core/types/src/__tests__/media.test.ts packages/core/types/tests/media-probe/fixture.ts
          sed -i "s|'../|'../../src/|g" packages/core/types/tests/media-probe/fixture.ts
          cat >> packages/core/types/tests/media-probe/fixture.ts <<'EOF'
          export const numericCover: Modules.Documents.Params.Data.Input<'api::article.article'> = { cover: 1 };
          export const numericGallery: Modules.Documents.Params.Data.Input<'api::article.article'> = { gallery: [1, 2] };
          EOF
          set +e
          yarn workspace @strapi/types exec tsc -p tests/media-probe/tsconfig.json --pretty false > /tmp/media-input.log 2>&1
          result=$?
          set -e
          cat /tmp/media-input.log
          test "$result" -ne 0
          grep -E 'fixture.ts.*error TS2322' /tmp/media-input.log
          echo 'Confirmed: valid numeric media IDs are rejected by the current PR input types.'
