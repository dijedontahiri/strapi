name: Validate duplicate locale deletion final

on:
  push:
    branches:
      - validate/27656-concurrency-lock-final

permissions:
  contents: read

concurrency:
  group: validate-duplicate-locale-final-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_DAEMON: 'false'
  STRAPI_TELEMETRY_DISABLED: 'true'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f26f7e3fab95f1530bcc75eefb2349d706c96972
          fetch-depth: 12
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - name: Install pinned dependencies
        run: |
          corepack enable
          yarn install --immutable
      - name: Build i18n package and dependencies
        run: yarn nx run @strapi/i18n:build --nx-ignore-cycles --parallel=2
      - name: Prove upstream deletion logic fails the focused regression
        if: matrix.node == 22
        shell: bash
        run: |
          source=packages/plugins/i18n/server/src/services/locales.ts
          git show 5fcd743f4965ed3efef854b6c36b60bee8fae29b:"$source" > "$source"
          set +e
          yarn workspace @strapi/i18n test:unit --runInBand --testPathPattern=locales-duplicate-delete.test.ts
          status=$?
          set -e
          test "$status" -ne 0
          git restore -- "$source"
      - name: Run focused duplicate-locale regression
        run: yarn workspace @strapi/i18n test:unit --runInBand --testPathPattern=locales-duplicate-delete.test.ts
      - name: Run complete i18n unit suite
        run: yarn workspace @strapi/i18n test:unit --runInBand
      - name: Type-check i18n admin
        run: yarn workspace @strapi/i18n test:ts:front
      - name: Lint i18n package
        run: yarn workspace @strapi/i18n lint
      - name: Check changed-file formatting
        run: yarn prettier --check packages/plugins/i18n/server/src/services/locales.ts packages/plugins/i18n/server/src/services/__tests__/locales.test.ts packages/plugins/i18n/server/src/services/__tests__/locales-duplicate-delete.test.ts
      - name: Verify production diff remains focused
        run: |
          git diff --check 5fcd743f4965ed3efef854b6c36b60bee8fae29b..HEAD
          test "$(git diff --name-only 5fcd743f4965ed3efef854b6c36b60bee8fae29b..HEAD | wc -l)" -eq 3
