name: Validate duplicate locale deletion fix

on:
  push:
    branches:
      - validate/27656-duplicate-locale-delete

permissions:
  contents: read

env:
  NX_DAEMON: 'false'
  STRAPI_TELEMETRY_DISABLED: 'true'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 07885c33ed100c843d07a72e3a2d560362ce6bdb
          fetch-depth: 4
          persist-credentials: false
      - name: Verify exact fix head
        run: test "$(git rev-parse HEAD)" = "07885c33ed100c843d07a72e3a2d560362ce6bdb"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - name: Install pinned dependencies
        run: |
          corepack enable
          yarn install --immutable
      - name: Build i18n package and dependencies
        run: yarn nx run @strapi/i18n:build --nx-ignore-cycles --parallel=2
      - name: Prove regression against upstream
        if: matrix.node == 22
        shell: bash
        run: |
          source=packages/plugins/i18n/server/src/services/locales.ts
          cp "$source" /tmp/locales-fixed.ts
          trap 'cp /tmp/locales-fixed.ts "$source"' EXIT
          git show 5fcd743f4965ed3efef854b6c36b60bee8fae29b:"$source" > "$source"
          set +e
          yarn workspace @strapi/i18n test:unit --runInBand --testPathPattern=locales-duplicate-delete.test.ts --json --outputFile=/tmp/i18n-before.json
          status=$?
          set -e
          test "$status" -eq 1
          node -e "const r=require('/tmp/i18n-before.json'); if(r.numFailedTests!==1 || r.numPassedTests!==1 || r.numTotalTests!==2) throw Error('Unexpected upstream regression result'); console.log('Upstream regression confirmed: 1 failing assertion, 1 passing control');"
          cp /tmp/locales-fixed.ts "$source"
          trap - EXIT
      - name: Run duplicate locale regression tests
        run: yarn workspace @strapi/i18n test:unit --runInBand --testPathPattern=locales-duplicate-delete.test.ts
      - name: Run complete i18n unit suite
        run: yarn workspace @strapi/i18n test:unit --runInBand
      - name: Lint i18n package
        run: yarn workspace @strapi/i18n lint
      - name: Check changed-file formatting
        run: yarn prettier --check packages/plugins/i18n/server/src/services/locales.ts packages/plugins/i18n/server/src/services/__tests__/locales-duplicate-delete.test.ts
      - name: Ensure validation did not modify tracked source
        run: git diff --exit-code
