name: Duplicate locale contribution validation

on:
  push:
    branches: [validate/duplicate-locales-20260917]

permissions:
  contents: read

concurrency:
  group: duplicate-locales-${{ github.ref }}
  cancel-in-progress: true

env:
  FIX_SHA: cae7f3975c6154b1bbc30471ae878293b966ebc5
  BASE_SHA: 3cd7dba3495e094682cc7a8d0eb83bde77e9b0b4
  NX_DAEMON: 'false'
  STRAPI_TELEMETRY_DISABLED: 'true'
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  unit-build-lint:
    if: github.repository == 'dijedontahiri/strapi'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.FIX_SHA }}
          fetch-depth: 5
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - name: Build code and declarations including dependencies
        run: |
          corepack enable
          yarn install --immutable > /tmp/install.log 2>&1 || { tail -100 /tmp/install.log; exit 1; }
          yarn nx run @strapi/i18n:build --nx-ignore-cycles --parallel=2 > /tmp/build.log 2>&1 || { tail -100 /tmp/build.log; exit 1; }
          tail -10 /tmp/build.log
      - name: Verify regression against original implementation
        if: matrix.node == 22
        run: |
          source=packages/plugins/i18n/server/src/services/locales.ts
          trap 'git restore -- "$source"' EXIT
          git show "$BASE_SHA:$source" > "$source"
          set +e
          yarn workspace @strapi/i18n test:unit --runInBand --testPathPattern=duplicate-locale-deletion.test.ts --json --outputFile=/tmp/before.json > /tmp/before.log 2>&1
          status=$?
          set -e
          test "$status" -eq 1
          node <<'NODE'
          const assert = require('node:assert/strict');
          const r = require('/tmp/before.json');
          assert.equal(r.numTotalTests, 7);
          assert.equal(r.numRuntimeErrorTestSuites, 0);
          assert.equal(r.numFailedTests, 4);
          assert.equal(r.numPassedTests, 3);
          console.log('Original implementation: 4 failing regressions and 3 passing controls');
          NODE
          git restore -- "$source"
          trap - EXIT
      - name: Run complete server unit suite
        run: yarn workspace @strapi/i18n test:unit --runInBand --testPathPattern=server/src
      - name: Lint entire i18n package and check submitted formatting
        run: |
          yarn workspace @strapi/i18n lint
          yarn prettier --check packages/plugins/i18n/server/src/services/locales.ts packages/plugins/i18n/server/src/services/__tests__/duplicate-locale-deletion.test.ts tests/api/plugins/i18n/duplicate-locales.test.api.js
          git diff --check "$BASE_SHA" HEAD
      - name: Type-check changed service and regression tests
        run: |
          config=packages/plugins/i18n/server/tsconfig.duplicate-locale-check.json
          trap 'rm -f "$config"' EXIT
          printf '%s\n' '{"extends":"./tsconfig.json","include":["./src/services/locales.ts","./src/services/__tests__/duplicate-locale-deletion.test.ts"]}' > "$config"
          yarn tsc --project "$config" --noEmit
      - name: Compare full-server test typing diagnostics with upstream
        if: matrix.node == 22
        run: |
          source=packages/plugins/i18n/server/src/services/locales.ts
          regression=packages/plugins/i18n/server/src/services/__tests__/duplicate-locale-deletion.test.ts
          trap 'git restore -- "$source" "$regression"' EXIT
          set +e
          yarn tsc --project packages/plugins/i18n/server/tsconfig.json --noEmit --pretty false > /tmp/types-after.txt 2>&1
          fixed_status=$?
          set -e
          git show "$BASE_SHA:$source" > "$source"
          rm "$regression"
          set +e
          yarn tsc --project packages/plugins/i18n/server/tsconfig.json --noEmit --pretty false > /tmp/types-before.txt 2>&1
          base_status=$?
          set -e
          cat /tmp/types-after.txt
          test "$fixed_status" -eq "$base_status"
          diff -u /tmp/types-before.txt /tmp/types-after.txt
          echo 'Full-server test typing still has upstream errors; no additional diagnostics introduced.'
          git restore -- "$source" "$regression"
          trap - EXIT

  database-api:
    if: github.repository == 'dijedontahiri/strapi'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres, mysql]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strapi
          POSTGRES_PASSWORD: strapi
          POSTGRES_DB: strapi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U strapi -d strapi_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: strapi_test
          MYSQL_USER: strapi
          MYSQL_PASSWORD: strapi
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 10s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.FIX_SHA }}
          fetch-depth: 5
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Build runtime workspaces for API harness
        run: |
          corepack enable
          yarn install --immutable > /tmp/install.log 2>&1 || { tail -100 /tmp/install.log; exit 1; }
          yarn build:code --parallel=2 > /tmp/build.log 2>&1 || { tail -100 /tmp/build.log; exit 1; }
          tail -8 /tmp/build.log
      - name: Prepare PostgreSQL schema
        if: matrix.database == 'postgres'
        env:
          PGPASSWORD: strapi
        run: psql -h 127.0.0.1 -U strapi -d strapi_test -c 'CREATE SCHEMA IF NOT EXISTS myschema;'
      - name: Prove the original loses content after deletion
        run: |
          source=packages/plugins/i18n/server/src/services/locales.ts
          trap 'git restore -- "$source"' EXIT
          git show "$BASE_SHA:$source" > "$source"
          yarn workspace @strapi/i18n build:code > /tmp/rebuild.log 2>&1
          set +e
          yarn test:api --db=${{ matrix.database }} tests/api/plugins/i18n/duplicate-locales.test.api.js --json --outputFile=/tmp/before.json > /tmp/before.log 2>&1
          status=$?
          set -e
          tail -35 /tmp/before.log
          test "$status" -eq 1
          node <<'NODE'
          const assert = require('node:assert/strict');
          const r = require('/tmp/before.json');
          assert.equal(r.numTotalTests, 5);
          assert.equal(r.numRuntimeErrorTestSuites, 0);
          assert.equal(r.numFailedTests, 3);
          assert.equal(r.numPassedTests, 2);
          for (const t of r.testResults.flatMap(s => s.assertionResults)) {
            if (t.status === 'failed') assert.match(t.failureMessages.join('\n'), /toEqual/);
          }
          console.log('Original implementation: 3 content-equality failures after deletion and 2 passing controls');
          NODE
          git restore -- "$source"
          trap - EXIT
      - name: Verify existing locale API tests and all new regressions
        if: success() || failure()
        run: |
          git restore -- packages/plugins/i18n/server/src/services/locales.ts
          yarn workspace @strapi/i18n build:code > /tmp/rebuild.log 2>&1
          yarn test:api --db=${{ matrix.database }} 'tests/api/plugins/i18n/(duplicate-locales|locales).test.api.js' --json --outputFile=/tmp/after.json > /tmp/after.log 2>&1 || { tail -160 /tmp/after.log; exit 1; }
          tail -20 /tmp/after.log
          node <<'NODE'
          const assert = require('node:assert/strict');
          const r = require('/tmp/after.json');
          assert.equal(r.numPassedTests, 21);
          assert.equal(r.numFailedTests, 0);
          assert.equal(r.numRuntimeErrorTestSuites, 0);
          console.log('Final exact head: 21 API tests passed');
          NODE
