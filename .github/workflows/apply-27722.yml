name: Repair 27722 review findings

on:
  push:
    branches:
      - automation/27722-apply

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'dijedontahiri/strapi'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/27722-revalidate-release-actions
          fetch-depth: 0

      - name: Verify candidate head before repair
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "5d45cdc811d3ed3b0f2e337cc1aa10f0c604602b"
          git status --porcelain=v1
          test -z "$(git status --porcelain=v1)"

      - name: Add review regressions
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("packages/core/content-releases/server/src/services/__tests__/release.test.ts")
          source = path.read_text()

          invalid_start = source.index(
              "    it('revalidates publish actions and blocks entries that are currently invalid', async () => {"
          )
          invalid_end = source.index(
              "\n\n    it('publishes a stale blocked release when its entries are currently valid', async () => {",
              invalid_start,
          )
          invalid_test = """    it('revalidates publish actions and blocks entries that are currently invalid', async () => {
                mockExecute.mockReturnValueOnce({
                  id: 1,
                  name: 'Release',
                  releasedAt: null,
                  status: 'ready',
                });
                mockGetDraftEntryValidStatus.mockResolvedValueOnce(false);

                const action = {
                  contentType: 'api::contentTypeA.contentTypeA',
                  type: 'publish',
                  entryDocumentId: 'doc1',
                  locale: 'en',
                };

                const rollback = jest.fn();
                const releaseUpdate = jest.fn();
                const emit = jest.fn();
                const transaction = jest.fn().mockImplementation(async (fn) => {
                  if (!fn) {
                    return { commit: jest.fn(), get: jest.fn() };
                  }

                  try {
                    return await fn({ trx: jest.fn() });
                  } catch (error) {
                    rollback();
                    throw error;
                  }
                });

                const strapiMock = {
                  ...baseStrapiMock,
                  eventHub: { emit },
                  db: {
                    ...baseStrapiMock.db,
                    transaction,
                    query: jest.fn().mockImplementation((modelUid: string) => {
                      if (modelUid === 'plugin::content-releases.release-action') {
                        return {
                          findMany: jest.fn().mockResolvedValue([action]),
                        };
                      }

                      return {
                        update: releaseUpdate,
                      };
                    }),
                  },
                };

                // @ts-expect-error Ignore missing properties
                const releaseService = createReleaseService({ strapi: strapiMock });

                await expect(releaseService.publish(1)).rejects.toThrow('Release is blocked');

                expect(mockGetDraftEntryValidStatus).toHaveBeenCalledWith(
                  {
                    contentType: action.contentType,
                    documentId: action.entryDocumentId,
                    locale: action.locale,
                  },
                  { strapi: strapiMock }
                );
                expect(transaction).toHaveBeenCalledTimes(1);
                expect(rollback).toHaveBeenCalledTimes(1);
                expect(mockPublish).not.toHaveBeenCalled();
                expect(releaseUpdate).not.toHaveBeenCalled();
                // emitAudit and the publish webhook both use eventHub.emit. A pre-flight
                // rejection must leave both paths untouched.
                expect(emit).not.toHaveBeenCalled();
              });"""
          source = source[:invalid_start] + invalid_test + source[invalid_end:]

          snapshot_start = source.index(
              "    it('publishes a stale blocked release when its entries are currently valid', async () => {"
          )
          snapshot_end = source.index(
              "\n\n    it('throws an error if the release have 0 actions', () => {",
              snapshot_start,
          )
          snapshot_test = """    it('publishes the exact release-action snapshot that was revalidated', async () => {
                mockExecute.mockReturnValueOnce({
                  id: 1,
                  name: 'Release',
                  releasedAt: null,
                  status: 'blocked',
                });
                mockGetDraftEntryValidStatus.mockResolvedValueOnce(true);

                const validatedAction = {
                  contentType: 'api::contentTypeA.contentTypeA',
                  type: 'publish',
                  entryDocumentId: 'doc1',
                  locale: 'en',
                };
                const laterAction = {
                  contentType: 'api::contentTypeA.contentTypeA',
                  type: 'publish',
                  entryDocumentId: 'doc2',
                  locale: 'en',
                };
                const findMany = jest
                  .fn()
                  .mockResolvedValueOnce([validatedAction])
                  .mockResolvedValueOnce([laterAction]);

                const strapiMock = {
                  ...baseStrapiMock,
                  db: {
                    ...baseStrapiMock.db,
                    query: jest.fn().mockImplementation((modelUid: string) => {
                      if (modelUid === 'plugin::content-releases.release-action') {
                        return { findMany };
                      }

                      return {
                        update: jest.fn().mockResolvedValue({
                          id: 1,
                          name: 'Release',
                          status: 'done',
                          releasedAt: new Date(),
                        }),
                      };
                    }),
                  },
                };

                // @ts-expect-error Ignore missing properties
                const releaseService = createReleaseService({ strapi: strapiMock });

                await releaseService.publish(1);

                expect(findMany).toHaveBeenCalledTimes(1);
                expect(mockGetDraftEntryValidStatus).toHaveBeenCalledWith(
                  {
                    contentType: validatedAction.contentType,
                    documentId: validatedAction.entryDocumentId,
                    locale: validatedAction.locale,
                  },
                  { strapi: strapiMock }
                );
                expect(mockPublish).toHaveBeenCalledWith({ documentId: 'doc1', locale: 'en' });
                expect(mockPublish).not.toHaveBeenCalledWith({ documentId: 'doc2', locale: 'en' });
              });"""
          source = source[:snapshot_start] + snapshot_test + source[snapshot_end:]

          path.write_text(source)
          PY
          git diff --check

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build Content Releases and dependencies
        run: yarn nx run @strapi/content-releases:build --nx-ignore-cycles --parallel=2

      - name: Prove snapshot regression against current PR head
        shell: bash
        run: |
          set +e
          yarn workspace @strapi/content-releases test:unit --runInBand server/src/services/__tests__/release.test.ts --testNamePattern='publishes the exact release-action snapshot that was revalidated'
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Expected the exact-snapshot review regression to fail before the source repair"
            exit 1
          fi

      - name: Apply source repair
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("packages/core/content-releases/server/src/services/release.ts")
          source = path.read_text()

          helpers_start = source.index(
              "  /**\n   * Given a release id, it returns the actions formatted ready to be used to publish them."
          )
          helpers_end = source.index("\n\n  return {", helpers_start)
          helpers = """  const getReleaseActions = async (releaseId: Release['id']) => {
            const actions = (await strapi.db.query(RELEASE_ACTION_MODEL_UID).findMany({
              where: {
                release: {
                  id: releaseId,
                },
              },
            })) as ReleaseAction[];

            if (actions.length === 0) {
              throw new errors.ValidationError('No entries to publish');
            }

            return actions;
          };

          /**
           * Formats a release-action snapshot ready to publish.
           * Validation and publishing deliberately share this same in-memory snapshot so an
           * action cannot be changed between the validation query and the publish query.
           */
          const getFormattedActions = (actions: ReleaseAction[]) => {
            const formattedActions: {
              [key: UID.ContentType]: {
                publish: { documentId: ReleaseAction['entryDocumentId']; locale?: string }[];
                unpublish: { documentId: ReleaseAction['entryDocumentId']; locale?: string }[];
              };
            } = {};

            for (const action of actions) {
              const contentTypeUid: UID.ContentType = action.contentType;

              if (!formattedActions[contentTypeUid]) {
                formattedActions[contentTypeUid] = {
                  publish: [],
                  unpublish: [],
                };
              }

              formattedActions[contentTypeUid][action.type].push({
                documentId: action.entryDocumentId,
                locale: action.locale,
              });
            }

            return formattedActions;
          };

          const validatePublishActions = async (actions: ReleaseAction[]) => {
            const validity = await Promise.all(
              actions
                .filter((action) => action.type === 'publish')
                .map((action) =>
                  getDraftEntryValidStatus(
                    {
                      contentType: action.contentType,
                      documentId: action.entryDocumentId,
                      locale: action.locale,
                    },
                    { strapi }
                  )
                )
            );

            if (validity.some((isValid) => !isValid)) {
              throw new errors.ValidationError('Release is blocked');
            }
          };"""
          source = source[:helpers_start] + helpers + source[helpers_end:]

          old = """          // Release action validity is cached for the admin UI and can become stale when
                    // content changes outside the document-service middleware. Revalidate immediately
                    // before publishing so the publish decision reflects the current entries.
                    await validatePublishActions(releaseId);

                    strapi.log.info(`[Content Releases] Starting to publish release ${lockedRelease.name}`);

                    const formattedActions = await getFormattedActions(releaseId);"""
          new = """          // Release action validity is cached for the admin UI and can become stale when
                    // content changes outside the document-service middleware. Read the actions once
                    // after locking the release, then validate and publish that exact snapshot.
                    const actions = await getReleaseActions(releaseId);
                    await validatePublishActions(actions);

                    strapi.log.info(`[Content Releases] Starting to publish release ${lockedRelease.name}`);

                    const formattedActions = getFormattedActions(actions);"""
          if source.count(old) != 1:
              raise SystemExit(f"publish block occurrence count: {source.count(old)}")
          source = source.replace(old, new, 1)

          path.write_text(source)
          PY
          git diff --check

      - name: Run repaired focused regression
        run: yarn workspace @strapi/content-releases test:unit --runInBand server/src/services/__tests__/release.test.ts

      - name: Run complete server unit suite
        run: yarn workspace @strapi/content-releases test:unit --runInBand

      - name: Type check
        run: yarn workspace @strapi/content-releases build:types

      - name: Lint
        run: yarn workspace @strapi/content-releases lint

      - name: Formatting
        run: yarn prettier --check packages/core/content-releases/server/src/services/release.ts packages/core/content-releases/server/src/services/__tests__/release.test.ts

      - name: Verify focused product diff
        shell: bash
        run: |
          git diff --check
          files="$(git diff --name-only HEAD)"
          test "$files" = "$(printf '%s\n' \
            packages/core/content-releases/server/src/services/__tests__/release.test.ts \
            packages/core/content-releases/server/src/services/release.ts)"

      - name: Commit and push repaired candidate
        shell: bash
        run: |
          git config user.name 'dijedontahiri'
          git config user.email '99071957+dijedontahiri@users.noreply.github.com'
          git add packages/core/content-releases/server/src/services/release.ts packages/core/content-releases/server/src/services/__tests__/release.test.ts
          git commit -m 'fix(content-releases): validate published action snapshot'
          git push origin HEAD:fix/27722-revalidate-release-actions
